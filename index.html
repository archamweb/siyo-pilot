      if(Math.abs(raw)<0.001)return'<span style="color:#b8c2cc">—</span>';
      const differs=Math.abs(raw-retained)>0.05;
      return `<span title="${differs?'Écart entre le cumul saisi et la valeur retenue par DN':''}" style="color:${differs?'#d97706':'#36b37e'};font-family:'JetBrains Mono',monospace;font-size:10px">${fmt(Math.round(raw))}${differs?' ⚠':''}</span>`;
    };
    const poseCell=`<span style="color:${cP(posePct)};font-size:11px;font-weight:600">${fmt(lPoseRet)}</span><div style="font-size:10px;font-weight:600;color:${cP(posePct)};margin-top:2px">${posePct.toFixed(1)}%</div>`;
    const resteCell=restePose<=0.05?'<span style="color:#36b37e;font-weight:600">0 ml</span>':`<span style="color:${restePose>1000?'#e74c3c':'#d97706'};font-weight:600">${fmt(restePose)} ml</span>`;
    const essaisCell=`<span style="font-size:11px;font-weight:600;color:${cP(essaisPct)}">${fmt(lEssRet)}</span><div style="font-size:10px;font-weight:600;color:${cP(essaisPct)};margin-top:2px">${essaisPct.toFixed(1)}%</div>`;
    const gcPct=l.regards>0?Math.min(100,(+(c.gcProgress||0))/l.regards*100):0;
    const gcCell=l.regards===0?'<span style="color:#b8c2cc;font-size:10px">N/A</span>':(+(c.gcProgress||0)>0?`<span style="font-size:11px;font-weight:600;color:${cP(gcPct)}">${gcPct.toFixed(1)}%</span><div style="font-size:9px;color:#8a95a5;margin-top:2px">${Math.min(c.gc,l.regards)}/${l.regards} réceptionnés</div>`:'<span class="kb bo" style="font-size:9px">Non renseigné</span>');
    const situation=restePose<=0.05?'<span class="kb bg" style="font-size:10px">✓ Pose achevée</span>':`<span class="kb ${restePose>1000?'br':'bo'}" style="font-size:10px">Pose incomplète</span>`;
    lotTotals.barRaw+=lBar;lotTotals.soudRaw+=c.s;lotTotals.fouilleRaw+=c.f;lotTotals.poseRaw+=c.r;
    lotTotals.poseRetenue+=lPoseRet;lotTotals.essaisRetenus+=lEssRet;lotTotals.gcDone+=Math.min(Math.max(+(c.gc||0),0),l.regards);lotTotals.gcProgress+=Math.min(Math.max(+(c.gcProgress||0),0),l.regards);lotTotals.gcPlanned+=l.regards;
    h+=`<tr><td style="font-weight:600">Lot ${i+1}</td><td style="font-weight:600">${l.nm}${badgeContrainte}</td>
      <td><span class="kb ${l.z==='Ouest'?'bbl':'bg'}" style="font-size:10px">${l.z}</span></td>
      <td class="nr">${fmt(l.tot)}</td>
      <td class="nr lot-detail" style="${lotDetailStyle}">${rawCell(lBar,lBarRet)}</td>
      <td class="nr lot-detail" style="${lotDetailStyle}">${rawCell(c.s,lSoudRet)}</td>
      <td class="nr lot-detail" style="${lotDetailStyle}">${rawCell(c.f,lFouRet)}</td>
      <td class="nr lot-detail" style="${lotDetailStyle}">${rawCell(c.r,lPoseRet)}</td>
      <td class="nr">${poseCell}</td><td class="nr">${resteCell}</td><td class="nr">${essaisCell}</td><td class="nr">${gcCell}</td>
      <td class="lot-detail" style="${lotDetailStyle}">${bar(a.pc)}</td><td>${situation}</td></tr>`;
  });
  const totalPosePct=tP>0?lotTotals.poseRetenue/tP*100:0;
  const totalEssaisPct=tP>0?lotTotals.essaisRetenus/tP*100:0;
  const totalReste=Math.max(0,tP-lotTotals.poseRetenue);
  const totalGcPct=lotTotals.gcPlanned>0?lotTotals.gcProgress/lotTotals.gcPlanned*100:0;
  const totalGcCell=lotTotals.gcPlanned===0?'<span style="color:#b8c2cc">N/A</span>':(lotTotals.gcProgress>0?`<span style="font-size:11px;font-weight:600;color:${cP(totalGcPct)}">${totalGcPct.toFixed(1)}%</span><div style="font-size:9px;color:#8a95a5">${fmt(lotTotals.gcDone)}/${fmt(lotTotals.gcPlanned)} réceptionnés</div>`:'<span class="kb bo" style="font-size:9px">Non renseigné</span>');
  h+=`<tr style="font-weight:700;border-top:2px solid #cbd5e1;background:#f1f5f9">
    <td colspan="3">TOTAL PROJET</td><td class="nr">${fmt(tP)}</td>
    <td class="nr lot-detail" style="${lotDetailStyle}">${fmt(Math.round(lotTotals.barRaw))}</td>
    <td class="nr lot-detail" style="${lotDetailStyle}">${fmt(Math.round(lotTotals.soudRaw))}</td>
    <td class="nr lot-detail" style="${lotDetailStyle}">${fmt(Math.round(lotTotals.fouilleRaw))}</td>
    <td class="nr lot-detail" style="${lotDetailStyle}">${fmt(Math.round(lotTotals.poseRaw))}</td>
    <td class="nr"><span style="color:${cP(totalPosePct)};font-size:11px">${fmt(lotTotals.poseRetenue)}</span><div style="font-size:10px;font-weight:600;color:${cP(totalPosePct)};margin-top:2px">${totalPosePct.toFixed(1)}%</div></td>
    <td class="nr"><span style="color:${totalReste>0?'#e74c3c':'#36b37e'}">${fmt(totalReste)} ml</span></td>
    <td class="nr"><span style="color:${cP(totalEssaisPct)};font-size:11px">${fmt(lotTotals.essaisRetenus)}</span><div style="font-size:10px;font-weight:600;color:${cP(totalEssaisPct)};margin-top:2px">${totalEssaisPct.toFixed(1)}%</div></td>
    <td class="nr">${totalGcCell}</td>
    <td class="lot-detail" style="${lotDetailStyle}">${bar(synth.index)}</td>
    <td>${totalReste<=0.05?'<span class="kb bg" style="font-size:10px">✓ Pose achevée</span>':'<span class="kb br" style="font-size:10px">Pose incomplète</span>'}</td>
  </tr>`;
  h+=`</tbody></table></div>
    <div style="font-size:10px;color:#8a95a5;margin-top:7px;font-style:italic">Les valeurs principales utilisent la pose retenue par DN. Les cumuls saisis et l'indice opérationnel interne restent disponibles dans les détails techniques. « Non renseigné » ne signifie pas qu'aucun regard n'a été réalisé.</div>
    </div>`;

  // ── 4. Synthèse par zone ──
  h+=`<div class="st">Synthèse par zone</div><div class="g2">`;
  ZN.forEach(zone=>{
    const locs=LOC.filter(l=>l.z===zone);
    const zP=locs.reduce((s,l)=>s+l.tot,0);
    const zRaw={bar:0,soud:0,fou:0,pose:0,ess:0};
    const zRet={bar:0,soud:0,fou:0,pose:0,ess:0};
    let zTopoLength=0;
    locs.forEach(l=>{
      zTopoLength+=Math.min(1,Math.max(0,+(cu[l.id]?.imp||0)))*l.tot;
      l.zones.forEach(zn=>Object.keys(zn.dn).forEach(dn=>{
        const planned=+zn.dn[dn]||0;
        const dc=cu[l.id]?.zones?.[zn.zid]?.dn?.[dn]||{};
        const raw={bar:+dc.bar||0,soud:+dc.s||0,fou:+dc.f||0,pose:+dc.r||0,ess:+dc.ess||0};
        Object.keys(raw).forEach(k=>{
          zRaw[k]+=raw[k];
          zRet[k]+=Math.min(Math.max(raw[k],0),planned);
        });
      }));
    });
    const zPct=v=>zP>0?Math.min(100,Math.max(0,v/zP*100)):0;
    const zPosePct=zPct(zRet.pose);
    const zReste=Math.max(0,zP-zRet.pose);
    const zRdLength=locs.filter(l=>cu[l.id]?.rincageStatus==='valide').reduce((s,l)=>s+l.tot,0);
    // Regards : l'absence de saisie est distinguée d'un avancement réellement nul.
    const zRegPrevu=locs.reduce((s,l)=>s+(l.regards||0),0);
    const zRegFait=locs.reduce((s,l)=>s+Math.min(Math.max(+(cu[l.id]?.gc||0),0),l.regards||0),0);
    const zRegProgress=locs.reduce((s,l)=>s+Math.min(Math.max(+(cu[l.id]?.gcProgress||0),0),l.regards||0),0);
    const zRates={
      mobilisation:100,
      topographie:zPct(zTopoLength),
      bardage:zPct(zRet.bar),
      assemblage:zPct(zRet.soud),
      ouverture:zPct(zRet.fou),
      fermeture:zPosePct,
      gc:zRegPrevu>0?Math.min(100,zRegProgress/zRegPrevu*100):0,
      essais:zPct(zRet.ess),
      rincage:zPct(zRdLength)
    };
    const zIndice=Object.keys(PHYSICAL_WEIGHTS).reduce((s,k)=>s+PHYSICAL_WEIGHTS[k]*(zRates[k]||0)/100,0);
    const zConstraints=structuredConstraints.filter(x=>(x.localite==='tous'||locs.some(l=>l.id===x.localite))&&x.statut==='en_cours').length+
      legacyConstraints.filter(x=>(x.localite==='tous'||locs.some(l=>l.id===x.localite))&&x.statut!=='resolu'&&!migratedLegacyIds.has(x.id)).length;
    const remainingLots=locs.map(l=>{
      let pose=0;
      l.zones.forEach(zn=>Object.keys(zn.dn).forEach(dn=>{
        const planned=+zn.dn[dn]||0;
        const raw=+(cu[l.id]?.zones?.[zn.zid]?.dn?.[dn]?.r||0);
        pose+=Math.min(Math.max(raw,0),planned);
      }));
      return{nm:l.nm,reste:Math.max(0,l.tot-pose)};
    }).sort((a,b)=>b.reste-a.reste);
    const front=remainingLots[0];
    const frontText=zReste<=0.05
      ?`✓ Pose achevée sur les ${locs.length} localités`
      :`Front restant principal : <b>${front.nm}</b> — ${fmt(front.reste)} ml (${(front.reste/zReste*100).toFixed(1)}% du reste de la zone)`;
    const hasCappedValues=Object.keys(zRaw).some(k=>Math.abs(zRaw[k]-zRet[k])>0.05);
    const clr=zone==='Ouest'?'#2c7be5':'#00b8d9';
    h+=`<div class="cd" style="border-top:4px solid ${clr}">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div style="font-size:16px;font-weight:700;color:#0f1b2d">Zone ${zone}</div>
        <div style="text-align:right"><div style="font-size:28px;font-weight:700;color:${cP(zPosePct)}">${zPosePct.toFixed(1)}%</div><div style="font-size:9px;color:#8a95a5">Conduite posée retenue</div></div>
      </div>
      <div style="font-size:12px;color:#5a6778;margin-bottom:10px">${locs.length} localités · ${fmt(zP)} ml de référence</div>
      <div class="kr" style="margin-bottom:8px">
        <div class="kc"><div class="kl">Soudure retenue</div><div class="kv" style="font-size:16px">${fmt(zRet.soud)} ml</div>${bar(zRates.assemblage)}</div>
        <div class="kc"><div class="kl">Fouille retenue</div><div class="kv" style="font-size:16px">${fmt(zRet.fou)} ml</div>${bar(zRates.ouverture)}</div>
        <div class="kc"><div class="kl">Essais conformes</div><div class="kv" style="font-size:16px">${fmt(zRet.ess)} ml</div>${bar(zRates.essais)}</div>
      </div>
      <div class="kr" style="margin-bottom:8px">
        <div class="kc"><div class="kl">Reste à poser</div><div class="kv" style="font-size:16px;color:${zReste>0.05?'#e74c3c':'#36b37e'}">${fmt(zReste)} ml</div><div style="font-size:10px;color:#8a95a5;margin-top:5px">${zReste>0.05?(100-zPosePct).toFixed(1)+'% du linéaire':'Pose achevée'}</div></div>
        <div class="kc"><div class="kl">Regards GC</div>${zRegProgress>0?`<div class="kv" style="font-size:16px">${zRates.gc.toFixed(1)}%</div>${bar(zRates.gc)}<div style="font-size:9px;color:#8a95a5;margin-top:3px">${zRegFait} / ${zRegPrevu} réceptionnés</div>`:`<div class="kv" style="font-size:14px;color:#d97706">Non renseigné</div><div style="font-size:10px;color:#8a95a5;margin-top:5px">${zRegPrevu} regards prévus</div>`}</div>
        <div class="kc"><div class="kl">Contraintes actives</div><div class="kv" style="font-size:16px;color:${zConstraints>0?'#d97706':'#36b37e'}">${zConstraints}</div><div style="font-size:10px;color:#8a95a5;margin-top:5px">${zConstraints>0?'à suivre dans le registre':'aucune à suivre'}</div></div>
      </div>
      <div style="font-size:11px;color:#5a6778;padding-top:8px;border-top:1px solid #eef1f5">${frontText}</div>
      <div style="font-size:9px;color:#8a95a5;margin-top:5px">Indice opérationnel interne : ${zIndice.toFixed(1)}%${hasCappedValues?' · Dépassements saisis neutralisés par DN.':''}</div>
    </div>`;});
  h+=`</div>`;

  // Safe mode toggle
  const alerts=checkCoherence(cumul('9999-12-31'));
  if(alerts.length){
    h+=`<div style="display:flex;align-items:center;gap:10px;margin-top:16px">
      <label style="font-size:12px;color:#5a6778;display:flex;align-items:center;gap:6px;cursor:pointer">
        <input type="checkbox" ${safeMode?'checked':''} onchange="safeMode=this.checked;draw()" style="width:16px;height:16px">
        🛡️ Mode sécurisé
      </label>${safeMode?'<span class="kb bg" style="font-size:10px">Actif</span>':''}
    </div>`;}

  h+=`</div>`;
  return h;
}

function mkDGCharts(){
  let cu=cumul('9999-12-31');
  if(safeMode)cu=safeCumul(cu);
  const months=groupByMonth();
  const mKeys=Object.keys(months).sort();
  const tP=LOC.reduce((s,l)=>s+l.tot,0);

  // Chart 1: courbes physique, opérationnelle et objectif physique
  const el1=document.getElementById('chDGcurve');
  if(el1){
    // Axe étendu couvrant toute la fenêtre du planning recalé (Jan 2026 → Juil 2026)
    // + décembre 2025 comme point de départ à 0% (début officiel planning d'origine)
    const allMonths=new Set([...mKeys]);
    // Fenêtre recalée (doit matcher buildPlannedCurve)
    const configuredRows=activePlanningVersion()?.rows||[];
    const planStart=new Date((configuredRows[0]?.month||PROJECT_CONFIG.identity?.startDate?.slice(0,7)||'2025-12')+'-01');
    const planDeadline=contractPlanningDeadline();
    const planEnd=planDeadline?new Date(planDeadline):new Date((mKeys.at(-1)||today().slice(0,7))+'-01');
    let d=new Date(planStart);
    while(d<=planEnd){
      allMonths.add(d.toISOString().slice(0,7));
      d.setMonth(d.getMonth()+1);d.setDate(1);
    }
    const xMonths=[...allMonths].sort();
    
    // Courbes réelles à la fin de chaque mois
    // - Avant la première saisie : 0% (point d'ancrage visuel, démarre bien à 0)
    // - Mois avec saisies : valeurs réelles
    // - Après dernier mois saisi : null (pas de ligne vers le futur)
    const premierMoisSaisi=mKeys[0]; // Plus petit mois contenant des données
    const dernierMoisSaisi=mKeys[mKeys.length-1];
    const reelPhysicalData=xMonths.map(m=>{
      // Mois strictement avant les premières saisies → 0% (démarrage propre)
      if(!premierMoisSaisi||m<premierMoisSaisi)return 0;
      // Mois strictement après les dernières saisies → null (ligne s'arrête)
      if(m>dernierMoisSaisi)return null;
      // Mois courant : calculer la référence physique cumulée à fin de mois
      const[yy,mm]=m.split('-').map(Number);
      const finMois=new Date(yy,mm,0).toISOString().slice(0,10);
      const cuM=cumul(finMois);
      return +avancementPhysique(cuM).toFixed(1);
    });
    const reelContinuityData=[];
    const reelOperationalData=xMonths.map(m=>{
      if(!premierMoisSaisi||m<premierMoisSaisi){reelContinuityData.push(0);return 0;}
      if(m>dernierMoisSaisi){reelContinuityData.push(null);return null;}
      const[yy,mm]=m.split('-').map(Number);
      const finMois=new Date(yy,mm,0).toISOString().slice(0,10);
      const cuM=cumul(finMois);
      reelContinuityData.push(+indiceContinuite(cuM).toFixed(1));
      return +avancementGlobal(cuM).toFixed(1);
    });
    // Note méthodologique : écart maximal entre l'indice V2 et l'indice de continuité
    {let gapMax=0,gapMonth='';xMonths.forEach((m,i)=>{const a=reelOperationalData[i],b=reelContinuityData[i];if(a===null||b===null||m<premierMoisSaisi)return;if(Math.abs(a-b)>Math.abs(gapMax)){gapMax=a-b;gapMonth=m;}});
      const gapEl=document.getElementById('dg-index-gap');if(gapEl)gapEl.textContent=gapMonth?` Écart maximal entre les deux indices : ${gapMax>0?'+':''}${gapMax.toFixed(1)} points (${moisNm(gapMonth)}).`:'';}
    // Courbe objectif physique : cycle de pose planifié
    const objData=buildPhysicalPlannedCurve(xMonths);
    const lastRealIndex=reelPhysicalData.reduce((last,v,i)=>v===null?last:i,-1);
    const deadlineIndex=planDeadline?xMonths.indexOf(planDeadline.slice(0,7)):-1;
    const deadlineMarker={
      id:'contractDeadlineMarker',
      afterDatasetsDraw(chart){
        if(deadlineIndex<0)return;
        const{x,y}=chart.scales;
        const xPos=x.getPixelForValue(deadlineIndex);
        const ctx=chart.ctx;
        ctx.save();
        ctx.strokeStyle='#b45309';ctx.lineWidth=1;ctx.setLineDash([4,4]);
        ctx.beginPath();ctx.moveTo(xPos,y.top);ctx.lineTo(xPos,y.bottom);ctx.stroke();
        ctx.setLineDash([]);ctx.fillStyle='#92400e';ctx.font='10px DM Sans';
        ctx.textAlign='right';ctx.fillText(`Échéance ${fD(planDeadline).replace(/\s+\d{4}$/,'')}`,xPos-5,y.top+12);
        ctx.restore();
      }
    };
    
    charts.push(new Chart(el1,{type:'line',data:{
      labels:xMonths.map(m=>{const p=moisNm(m).split(' ');return p[0].slice(0,4)+'. '+p[1];}),
      datasets:[
        {label:'Avancement physique — conduite posée',data:reelPhysicalData,
          borderColor:'#36b37e',backgroundColor:'#36b37e22',fill:true,spanGaps:false,
          pointBackgroundColor:'#36b37e',pointRadius:c=>c.dataIndex===lastRealIndex?6:3,pointHoverRadius:8,
          borderWidth:3,tension:0},
        {label:'Indice opérationnel interne',data:reelOperationalData,
          borderColor:'#2c7be5',backgroundColor:'transparent',fill:false,spanGaps:false,
          pointBackgroundColor:'#2c7be5',pointRadius:4,pointHoverRadius:6,
          borderWidth:2,tension:0,hidden:!DG_SHOW_OPERATIONAL},
        {label:'Indice de continuité — méthode des attachements',data:reelContinuityData,
          borderColor:'#5a6778',backgroundColor:'transparent',fill:false,spanGaps:false,
          pointBackgroundColor:'#5a6778',pointRadius:3,pointHoverRadius:6,
          borderWidth:2,borderDash:[2,4],tension:0},
        {label:activePlanningVersion()?.label||'Planning contractuel initial',data:objData,
          borderColor:'#f59e0b',backgroundColor:'transparent',fill:false,
          pointBackgroundColor:'#f59e0b',pointRadius:3,pointHoverRadius:7,
          borderWidth:2,borderDash:[8,4],tension:0},
      ]
    },options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{position:'top',labels:{font:{family:'DM Sans',size:12},boxWidth:14,usePointStyle:true,
          filter:item=>DG_SHOW_OPERATIONAL||item.text!=='Indice opérationnel interne'}},
        tooltip:{callbacks:{
          label:c=>{
            const value=+c.parsed.y||0;
            const showLength=!/^Indice/.test(c.dataset.label);
            return `${c.dataset.label}: ${value.toFixed(1)}%${showLength?' · '+fmt(value/100*tP)+' ml':''}`;
          },
          afterBody:items=>{
            if(!items.length)return'';
            const i=items[0].dataIndex,actual=reelPhysicalData[i],planned=objData[i];
            if(actual===null||actual===undefined||planned===null||planned===undefined)return'';
            const gap=actual-planned;
            return `Écart physique / planning : ${gap>=0?'+':''}${gap.toFixed(1)} pts · ${gap>=0?'+':''}${fmt(gap/100*tP)} ml`;
          }
        }}},
      scales:{y:{min:0,max:110,ticks:{callback:v=>v+'%',font:{family:'JetBrains Mono',size:10}},grid:{color:'#eef1f6'}},
        x:{grid:{display:false},ticks:{font:{family:'DM Sans',size:11}}}}
    },plugins:[deadlineMarker]}));
  }
}

function exportExcelCumul(){
  let cu=cumul('9999-12-31');
  if(safeMode)cu=safeCumul(cu);
  
  // ═══════ ONGLET 1 : Cumul détaillé par DN ═══════
  const rows=[];
  rows.push(['PROJET AEP KIMOUKRO — DISPERSION 1B']);
  rows.push(['Attachement quantitatif — Cumul au '+fD(today())]);
  rows.push([]);
  rows.push(['Lot','Localité','Zone','Sous-zone','DN','Prévu (ml)',
    'Bardage (ml)','% Bar',
    'Soudure (ml)','% Soud',
    'Fouille (ml)','% Fou',
    'Pose (ml)','% Pose',
    'Essai (ml)','% Ess']);
  
  let tP=0,tB=0,tS=0,tF=0,tR=0,tE=0;
  LOC.forEach((l,i)=>{
    const c=cu[l.id];

    rows.push(['','TOTAL ZONE '+zone,zone,'','',zP,

      Math.round(zS*10)/10,zP>0?zS/zP:0,
      Math.round(zF*10)/10,zP>0?zF/zP:0,
      Math.round(zR*10)/10,zP>0?zR/zP:0,
      Math.round(zE*10)/10,zP>0?zE/zP:0]);
  });
  // Total général
  rows.push(['','TOTAL GÉNÉRAL','','','',tP,
    Math.round(tB*10)/10,tP>0?Math.min(tB/tP,1):0,
    Math.round(tS*10)/10,tP>0?tS/tP:0,
    Math.round(tF*10)/10,tP>0?tF/tP:0,
    Math.round(tR*10)/10,tP>0?tR/tP:0,
    Math.round(tE*10)/10,tP>0?tE/tP:0]);
  
  const ws=XLSX.utils.aoa_to_sheet(rows);
  ws['!cols']=[{wch:8},{wch:14},{wch:8},{wch:10},{wch:8},{wch:11},{wch:12},{wch:8},{wch:12},{wch:8},{wch:12},{wch:8},{wch:12},{wch:8},{wch:12},{wch:8}];

      if(ws[cellRef]&&typeof ws[cellRef].v==='number'){ws[cellRef].z='0.0%';}
    });
  }
  
  // ═══════ ONGLET 2 : Indice opérationnel par lot ═══════
  const rows2=[];
  rows2.push([`INDICE OPÉRATIONNEL PAR LOT — ${projectName()}`]);
  rows2.push(['Pondération: imp=1 · bar=1 · soud=2 · fou=2 · rem=2 · ess=0,5 · gc=0,5 · rec=0,5 (total 9 ou 9,5 selon regards)']);
  rows2.push([]);
  rows2.push(['Lot','Localité','Zone','Prévu (ml)','Coef lot',
    '% Implantation','% Bardage','% Soudure','% Fouille','% Pose','% Essais','% GC','% Récolement',
    'Indice opérationnel interne']);
  
  LOC.forEach((l,i)=>{
    const a=avancementLot(l,cu[l.id]);
    rows2.push([
      'Lot '+(i+1),l.nm,l.z,l.tot,coefLot(l),

      a.detail.ess/100,

      a.detail.rec/100,
      a.pc/100
    ]);
  });
  // Total zone + total général pondérés
  rows2.push([]);
  const tPglob=LOC.reduce((s,l)=>s+l.tot,0);
  ZN.forEach(zone=>{
    const locs=LOC.filter(l=>l.z===zone);
    const zP=locs.reduce((s,l)=>s+l.tot,0);
    let zAv=0;locs.forEach(l=>{zAv+=avancementLot(l,cu[l.id]).pc*(l.tot/zP);});
    rows2.push(['','TOTAL ZONE '+zone,zone,zP,'','','','','','','','','',zAv/100]);
  });
  const avTot=avancementGlobal(cu);
  rows2.push(['','TOTAL GÉNÉRAL','',tPglob,'','','','','','','','','',avTot/100]);
  
  const ws2=XLSX.utils.aoa_to_sheet(rows2);
  ws2['!cols']=[{wch:8},{wch:14},{wch:8},{wch:10},{wch:8},
    {wch:8},{wch:8},{wch:8},{wch:8},{wch:8},{wch:8},{wch:8},{wch:8},{wch:16}];
  ws2['!merges']=[
    {s:{r:0,c:0},e:{r:0,c:13}},
    {s:{r:1,c:0},e:{r:1,c:13}}
  ];
  // Format % sur colonnes 5 à 13
  const range2=XLSX.utils.decode_range(ws2['!ref']);
  for(let R=4;R<=range2.e.r;R++){
    [5,6,7,8,9,10,11,12,13].forEach(C=>{
      const cellRef=XLSX.utils.encode_cell({r:R,c:C});
      if(ws2[cellRef]&&typeof ws2[cellRef].v==='number'){ws2[cellRef].z='0.0%';}
    });
  }
  
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Cumul détaillé');
  XLSX.utils.book_append_sheet(wb,ws2,'Indice interne');
  const fname='Cumul_Dispersion1B_'+today()+'.xlsx';

}

// EXPORT COMPLET — Snapshot JSON pour archivage / partage
// Usage : génère un fichier JSON contenant l'état complet du projet
// (rapports journaliers, aléas, méta-données) à la date du jour.
// Ce fichier peut être partagé pour reconstruire l'état projet ailleurs.

function exportComplet(){
  const ds=dbDates().sort();
  const aleas=getAleas();
  const snapshot={
    meta:{
      projet:projectName(),
      contractant:PROJECT_CONFIG.identity?.company||'',
      client:PROJECT_CONFIG.identity?.client||'',
      moe:PROJECT_CONFIG.identity?.owner||'',
      genere_le:new Date().toISOString(),
      genere_par:`Avancement ${projectShortName()} (web app)`,
      version_app:'2.1 — Base centrale Supabase · indice de continuité · attachement validé importé (03/09/2026)',
      nb_rapports:ds.length,
      premiere_date:ds[0]||null,
      derniere_date:ds[ds.length-1]||null,
      nb_aleas:aleas.length
    },
    parametres:{
      DATE_FIN_OBJECTIF:contractPlanningDeadline(),
      pilotage:getPilotageSettings(),
      ETAT_INITIAL_DATE,
      FENETRE_CADENCE_J,
      SEUIL_RETARD_CRITIQUE,
      definitions_indicateurs:{
        indice_operationnel:'Moyenne pondérée des activités suivies. Indicateur de pilotage non financier.',
        reference_physique:'Conduite posée cumulée, plafonnée au linéaire prévu pour chaque DN.',
        avancement_financier:'Non calculé tant que le DQE et les attachements validés ne sont pas raccordés.'
      },
      ACTIV,
      LOC:LOC.map(l=>({id:l.id,nm:l.nm,z:l.z,tot:l.tot,regards:l.regards,zones:l.zones}))
    },
    etat_initial:ETAT_INITIAL,
    rapports_journaliers:{},
    aleas:aleas
  };
  // Copier tous les rapports (sans les clés spéciales __aleas__)
  ds.forEach(d=>{snapshot.rapports_journaliers[d]=db[d];});
  
  const json=JSON.stringify(snapshot,null,2);
  const blob=new Blob([json],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const fname=`Export_Dispersion1B_${today()}.json`;
  a.href=url;a.download=fname;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
  
  // Calcul taille pour info
  const sizeKB=(blob.size/1024).toFixed(1);
  toast(`💾 Export complet : ${fname} (${sizeKB} Ko · ${ds.length} rapports · ${aleas.length} aléas)`);
}

function genericAttachmentLineValues(period,line){

  const previous=period?.previous?ATTACH_XLS.periods[period.previous]:null,prev=previous?+(genericAttachmentLineValues(previous,line).cumulative||0):0,key=line.id,has=Object.prototype.hasOwnProperty.call(period?.values||{},key),cumulative=has?+(period.values[key]||0):prev,month=cumulative-prev,market=(+line.marketQty||0)*(+line.unitPrice||0);

}

function pgAttachement(){
  const p=activeAttachPeriod(),periods=Object.values(ATTACH_XLS.periods).sort((a,b)=>b.key.localeCompare(a.key));

  if(p.imported)return renderImportedAttachment(p,periods);
  if(ATTACH_XLS.mode==='generic'){
    let h=`<div class="mn xls-attachment"><div class="xls-app-head"><div><div class="st" style="margin-bottom:4px">Attachement contractuel</div><div class="attach-subtitle">Référentiel construit depuis le DQE validé</div></div><div class="xls-app-actions no-print"><select class="fi" onchange="selectContractAttachment(this.value)">${periods.map(x=>`<option value="${x.key}" ${x.key===p.key?'selected':''}>N°${String(x.number).padStart(2,'0')} — ${x.label} · ${x.status==='validated'?'Validé':'Brouillon'}</option>`).join('')}</select><button class="bt" onclick="exportContractAttachmentExcel()">📊 Export Excel</button><button class="bt" onclick="printContractAttachment()">🖨 Imprimer</button>${p.status==='validated'?'<button class="bp" onclick="createNextContractAttachment()">+ Créer l’attachement du mois</button>':''}<button class="bp" onclick="beginContractAdjustment()">✎ Ajustement pour validation</button>${p.status==='draft'?'<button class="bt xls-validate" onclick="validateContractAttachment()">Valider l’attachement</button>':''}</div></div><div class="xls-document-head"><b>${contractAttachmentHeader(p)}</b><span>PROJET : ${escHtml(projectName().toUpperCase())}</span><span>ENTREPRISE : ${escHtml(PROJECT_CONFIG.identity?.company||'SIYO LIMITED')}</span></div>${renderGenericAttachment(p)}<div class="attach-disclaimer">${p.status==='validated'?'Situation validée et verrouillée.':'Brouillon local : les cumuls ajustés ne modifient pas les rapports terrain.'}</div></div>`;return h;
  }
  const adjustLot=ATTACH_XLS_LEVEL==='lot'?ATTACH_XLS_LOT:'oume';
  let h=`<div class="mn xls-attachment"><div class="xls-app-head"><div><div class="st" style="margin-bottom:4px">Attachement contractuel</div><div class="attach-subtitle">Reproduction de la structure du classeur validé</div></div><div class="xls-app-actions no-print"><select class="fi" onchange="selectContractAttachment(this.value)">${periods.map(x=>`<option value="${x.key}" ${x.key===p.key?'selected':''}>N°${String(x.number).padStart(2,'0')} — ${x.label} · ${x.status==='validated'?'Validé':'Brouillon'}</option>`).join('')}</select><button class="bt" onclick="exportContractAttachmentExcel()">📊 Export Excel</button><button class="bt" onclick="printContractAttachment()">🖨 Imprimer</button>${p.status==='validated'?'<button class="bp" onclick="createNextContractAttachment()">+ Créer l’attachement du mois</button>':''}<button class="bp" onclick="beginContractAdjustment('${adjustLot}')">✎ Ajustement pour validation</button>${p.status==='draft'?'<button class="bt xls-validate" onclick="validateContractAttachment()">Valider l’attachement</button>':''}</div></div><div class="xls-document-head"><b>${contractAttachmentHeader(p)}</b><span>OBJET DES TRAVAUX : RÉALISATION DE TRANCHÉE ET POSE DE TUYAUTERIE DISTRIBUTION PHASE 1B${ATTACH_XLS_LEVEL==='lot'?` - ${(LOC.find(l=>l.id===ATTACH_XLS_LOT)?.nm||'').toUpperCase()}`:''}</span><span>ENTREPRISE : ${escHtml(PROJECT_CONFIG.identity?.company||'SIYO LIMITED')}</span></div>`;
  h+=ATTACH_XLS_LEVEL==='recap'?renderContractRecap(p):renderContractLot(p,ATTACH_XLS_LOT);
  return h+`<div class="attach-disclaimer">${p.status==='validated'?'Situation validée et verrouillée.':'Brouillon enregistré localement. Les valeurs ajustées ne remplacent pas les données de la fenêtre Saisie.'}</div></div>`;
}

function runSiyoSelfTests(){
  const tests=[],check=(name,pass,detail='')=>tests.push({name,pass:!!pass,detail});
  const weightTotal=Object.values(PHYSICAL_WEIGHTS).reduce((s,v)=>s+(+v||0),0);check('Pondération physique à 100 %',Math.abs(weightTotal-100)<.01,weightTotal.toFixed(4));
  check('Session authentifiée',!!SESSION,PROFILE?.email||'');
  check('Rôle résolu sur le projet',!!CURRENT_USER_CONTEXT.role,CURRENT_USER_CONTEXT.label);
  check('Aucune donnée financière codée',ATTACH_DQE_LINES.length===0&&Object.keys(ATTACH_EXCEL_LOTS).length===0&&!ATTACHMENT_TEMPLATE_B64);
  check('Contraintes lues depuis les rapports sauvegardés',constraintsForReport('2026-04-18',{}).length===0);
  check('Statuts métier distincts',projectStatusLabel('works_completed')!==projectStatusLabel('closed'),'Travaux terminés ≠ projet achevé');
  check('Cellule DQE vide non convertie en zéro',dqeNumber('')===null);
  check('Titre DQE séparé des lignes chiffrées',dqeHeadingLike('SERIE 01 : INSTALLATION DE CHANTIER','',null,null));
  check('Génération mensuelle du planning',planningMonthRange('2026-09','2027-01').length===5,'Septembre 2026 à janvier 2027');
  check('Projet sans regard capable d’atteindre 100 %',Math.abs(normalizedPhysicalIndex(Object.fromEntries(Object.keys(PHYSICAL_WEIGHTS).map(k=>[k,100])),false)-100)<.001);
  check('Échappement des textes actifs',escHtml('<script>')==='&lt;script&gt;');
  return{ok:tests.every(t=>t.pass),passed:tests.filter(t=>t.pass).length,total:tests.length,tests};
}
window.__SIYO_TESTS__=runSiyoSelfTests;

  .cd{break-inside:avoid;box-shadow:none;border:1px solid #ddd}

  body.print-rapport .st{break-inside:avoid;page-break-after:avoid}
  body.print-rapport .cd{margin-bottom:6px!important;padding:8px 10px!important}

  body.print-constraints #constraint_export_scope{position:absolute;left:0;top:0;width:100%;margin:0!important;padding:0!important;border:0!important;box-shadow:none!important}
  body.print-constraints .constraint-export-title{display:flex!important;flex-direction:column;gap:3px;margin-bottom:12px;padding-bottom:9px;border-bottom:2px solid #0f1b2d}
  body.print-constraints .constraint-export-title b{font-size:18px;color:#0f1b2d}

  body.print-constraints .constraint-table{font-size:8px!important;table-layout:fixed}
  body.print-constraints .constraint-table th,body.print-constraints .constraint-table td{padding:4px 5px!important;word-break:normal;overflow-wrap:anywhere}
  body.print-constraints .constraint-table th:nth-child(1){width:10%}
  body.print-constraints .constraint-table th:nth-child(2){width:13%}
  body.print-constraints .constraint-table th:nth-child(3){width:10%}
  body.print-constraints .constraint-table th:nth-child(4){width:7%}
  body.print-constraints .constraint-table th:nth-child(5){width:20%}
  body.print-constraints .constraint-table th:nth-child(6){width:10%}
  body.print-constraints .constraint-table th:nth-child(7){width:20%}
  body.print-constraints .constraint-table th:nth-child(8){width:10%}
  @page{margin:10mm}
}
