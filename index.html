function normalizePilotageSettings(raw){
  const src=raw&&typeof raw==='object'?raw:{};
  const migrated={...PILOTAGE_DEFAULTS,...src};
  if(!src.targetMode&&src.mode)migrated.targetMode=src.mode;
  if(!src.targetDate&&src.date)migrated.targetDate=src.date;
  if(!['date','undefined'].includes(migrated.targetMode))migrated.targetMode='undefined';
  if(!['date','undefined'].includes(migrated.restartMode))migrated.restartMode='undefined';
  if(!['data','planning','manual'].includes(migrated.poseRateSource))migrated.poseRateSource='data';
  return migrated;
}

// Coefficients alignés sur le fichier Avancement_travaux_Dispersion_1B.xlsx
// Pour les lots sans regards (Hiré, Doukouya, Angoda, Gbonti), le coef "gc" est exclu
const ACTIV={
  imp:{nm:'Implantation',coef:1,base:'lot'},       // Oui/non par lot, base = linéaire total
  bar:{nm:'Bardage',coef:1,base:'dn'},              // ml par DN
  soud:{nm:'Soudure',coef:2,base:'dn'},             // ml par DN (actuel)
  fou:{nm:'Fouille',coef:2,base:'dn'},               // ml par DN (actuel)
  rem:{nm:'Pose',coef:2,base:'dn'},                  // ml par DN (actuel)
  ess:{nm:'Essai pression',coef:0.5,base:'dn'},     // ml par DN
  gc:{nm:'Travaux GC',coef:0.5,base:'regards'},     // Nb regards/total - exclu si lot sans regards
  rec:{nm:'Plan récolement',coef:0.5,base:'lot'}   // Oui/non par lot
};

// Coefficient total d'un lot selon présence de regards
function coefLot(lot){
  let s=0;Object.keys(ACTIV).forEach(k=>{if(k==='gc'&&lot.regards===0)return;s+=ACTIV[k].coef;});
  return s;
}
// ── Indice de continuité (03/09/2026) ──
// Méthode des attachements N°01 à N°08 (pondération ACTIV, moyenne des lots au prorata du linéaire).
// Conservé à côté de l'indice V2 pour que l'historique reste comparable aux situations signées.
function indiceContinuiteLot(lot,cuLot){
  if(!cuLot||!lot.tot)return 0;
  const det={imp:Math.min(1,+cuLot.imp||0)*100,bar:0,soud:0,fou:0,rem:0,ess:0,gc:0,rec:0};
  let barTot=0,essTot=0;
  lot.zones.forEach(zn=>{const zc=cuLot.zones?.[zn.zid];if(!zc)return;Object.entries(zn.dn).forEach(([dn,prev])=>{const dc=zc.dn?.[dn]||{};barTot+=Math.min(+dc.bar||0,+prev||0);essTot+=Math.min(+dc.ess||0,+prev||0);});});
  det.bar=barTot/lot.tot*100;det.ess=essTot/lot.tot*100;
  det.soud=Math.min(+cuLot.s||0,lot.tot)/lot.tot*100;det.fou=Math.min(+cuLot.f||0,lot.tot)/lot.tot*100;det.rem=Math.min(+cuLot.r||0,lot.tot)/lot.tot*100;
  if(lot.regards>0)det.gc=Math.min(1,(+(cuLot.gcProgress??cuLot.gc)||0)/lot.regards)*100;
  det.rec=(cuLot.recolementStatus==='valide'||+cuLot.rec>=1)?100:0;
  const cf=coefLot(lot);let total=0;Object.keys(ACTIV).forEach(k=>{if(k==='gc'&&lot.regards===0)return;total+=ACTIV[k].coef*det[k];});
  return cf?total/cf:0;
}
function indiceContinuite(cu){const tP=LOC.reduce((s,l)=>s+l.tot,0);return tP?LOC.reduce((s,l)=>s+indiceContinuiteLot(l,cu[l.id])*l.tot/tP,0):0;}

// Courbe d'objectif pondéré (cumul pondéré en %, par mois) — V2 avec toutes activités
// Principe : la contribution totale d'une tâche en % global dépend de la part de lot concernée
// Pour les lots multi-zones (Oumé, Hiré), chaque tâche ne concerne qu'une zone donc on pondère
function activePlanningVersion(cfg=PROJECT_CONFIG){
  const planning=cfg?.planning||{},id=planning.active||'initial';
  return id==='initial'?planning.initial:(planning.revisions||[]).find(r=>r.id===id)||planning.initial;
}
function configuredPlanningCurve(kind,months,cfg=PROJECT_CONFIG){
  const version=activePlanningVersion(cfg),rows=[...(version?.rows||[])].filter(r=>/^\d{4}-\d{2}$/.test(r.month||'')).sort((a,b)=>a.month.localeCompare(b.month));
  if(cfg?.planning?.mode!=='manual')return null;if(!rows.length)return months.map(()=>null);
  let last=0;
  return months.map(month=>{const row=rows.find(r=>r.month===month);if(row){const value=kind==='pose'?row.pose:row.global;if(value!==''&&value!==null&&value!==undefined&&Number.isFinite(+value))last=Math.max(0,Math.min(100,+value));}return+last.toFixed(1);});
}
function contractPlanningDeadline(cfg=PROJECT_CONFIG){return activePlanningVersion(cfg)?.deadline||cfg?.identity?.targetDate||'';}
function buildPlannedCurve(months){
  const configured=configuredPlanningCurve('global',months);if(configured)return configured;
  const coefLots={};LOC.forEach(l=>{coefLots[l.id]=coefLot(l);});
  const tPglob=LOC.reduce((s,l)=>s+l.tot,0);
  const monthly={};
  PLAN_TASKS.forEach(t=>{
    const lot=LOC.find(l=>l.id===t.lot);if(!lot)return;
    if(t.act==='gc'&&lot.regards===0)return;
    // Déterminer le "total couvert" par cette tâche
    // Pour une tâche sur une zone spécifique : zone.tot
    // Pour une tâche lot-wide (sans zone) : lot.tot
    let couv=lot.tot;
    if(t.zone){
      const zn=lot.zones.find(z=>z.zid===t.zone);
      couv=zn?zn.tot:lot.tot;
    }
    const d0=new Date(t.d0),d1=new Date(t.d1);
    let days=Math.round((d1-d0)/86400000);if(days<=0)days=1;
    let contribTotal=0;
    if(t.act==='pose'){
      // Pose DN : 3 activités (soud+fou+rem) coef 2 chacune = 6
      // Contribution = 6 × ml_tache / (coef_lot × tPglob) × 100
      contribTotal=6*(t.ml||0)/coefLots[t.lot]/tPglob*100;
    } else if(t.act==='bar'||t.act==='ess'){
      // Bardage/Essai : contribution = coef × ml_tache / (coef_lot × tPglob) × 100
      // ml_tache = couverture de la tâche (zone ou lot entier)
      contribTotal=ACTIV[t.act].coef*(t.ml||0)/coefLots[t.lot]/tPglob*100;
    } else if(t.act==='imp'){
      // Implantation : contribution = coef × couv / (coef_lot × tPglob) × 100
      contribTotal=ACTIV.imp.coef*couv/coefLots[t.lot]/tPglob*100;
    } else if(t.act==='rec'){
      // Plan récolement : 1 fois pour tout le lot
      contribTotal=ACTIV.rec.coef*lot.tot/coefLots[t.lot]/tPglob*100;
    } else if(t.act==='gc'){
      // Regards : 1 fois pour tout le lot si applicable
      contribTotal=ACTIV.gc.coef*lot.tot/coefLots[t.lot]/tPglob*100;
    }
    const contribParJour=contribTotal/days;
    let cur=new Date(d0);
    while(cur<d1){
      const m=cur.toISOString().slice(0,7);
      monthly[m]=(monthly[m]||0)+contribParJour;
      cur.setDate(cur.getDate()+1);
    }
  });
  let cum=0;
  return months.map(m=>{cum+=(monthly[m]||0);return +(Math.min(cum,100)).toFixed(1);});
}

// Courbe d'objectif PHYSIQUE : uniquement le cycle de pose achevé, représenté
// provisoirement par le linéaire remblayé. Elle ne doit pas être confondue avec
// l'indice opérationnel pondéré ni avec un avancement financier.
function buildPhysicalPlannedCurve(months){
  const configured=configuredPlanningCurve('pose',months);if(configured)return configured;
  const tPglob=LOC.reduce((s,l)=>s+l.tot,0);
  const monthly={};
  PLAN_TASKS.filter(t=>t.act==='pose').forEach(t=>{
    const d0=new Date(t.d0),d1=new Date(t.d1);
    let days=Math.round((d1-d0)/86400000);if(days<=0)days=1;
    const contribParJour=((t.ml||0)/tPglob*100)/days;
    let cur=new Date(d0);
    while(cur<d1){
      const m=cur.toISOString().slice(0,7);
      monthly[m]=(monthly[m]||0)+contribParJour;
      cur.setDate(cur.getDate()+1);
    }
  });
  let cum=0;
  return months.map(m=>{cum+=(monthly[m]||0);return +(Math.min(cum,100)).toFixed(1);});
}

// Reprise de sécurité du rapport terrain du 31/01/2026.
// La migration des contraintes V1 a conservé les faits mais a écrasé par erreur
// les quantités réseau de ce rapport sur le serveur. Cette copie, extraite du
// jeu de données V1 archivé, n'est appliquée que si le rapport distant ne porte
// plus aucune production. Elle évite donc tout double comptage si le serveur est réparé.

// ── STORAGE ──
let db={},online=false,syncing=false,lastSync='';
function isRemoteProject(){return true;}
function isConfigured(){return !!sb&&!!SESSION&&!!ACTIVE_PROJECT_ID;}
function stateKeyOf(k){return String(k).replace(/^__|__$/g,'');}
function stamp(){return new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});}
function normDate(d){if(!d)return'';if(typeof d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d))return d;const dt=new Date(d);if(isNaN(dt.getTime()))return String(d);return dt.toISOString().slice(0,10);}
function escHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function cleanText(v,max=2000){return String(v??'').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'').replace(/[<>]/g,'').trim().slice(0,max);}
async function syncLoad(){
  if(!isConfigured()){db={};online=false;draw();return;}
  const pid=ACTIVE_PROJECT_ID;syncing=true;draw();
  try{
    const [reps,states]=await Promise.all([
      sb.from('daily_reports').select('report_date,payload').eq('project_id',pid).order('report_date'),
      sb.from('project_state').select('key,value').eq('project_id',pid)
    ]);
    if(pid!==ACTIVE_PROJECT_ID){syncing=false;draw();return;}
    if(reps.error)throw reps.error;if(states.error)throw states.error;
    const next={};
    (reps.data||[]).forEach(r=>{next[normDate(r.report_date)]=r.payload;});
    (states.data||[]).forEach(s=>{next['__'+s.key+'__']=(s.key==='aleas'&&Array.isArray(s.value))?{aleas:s.value,dt:'__aleas__'}:s.value;});
    db=next;online=true;lastSync=stamp();
  }catch(e){console.error(e);online=false;toast('Lecture de la base impossible : '+(e?.message||e));}
  syncing=false;draw();
  try{await publishFinanceSummary();}catch(e){console.warn(e);}
}
async function syncSave(d,data){
  if(!canWrite()){toast('Lecture seule : ce rôle ne peut pas enregistrer.');return;}
  db[d]=data;if(!isConfigured())return;syncing=true;draw();
  try{
    const r=d.startsWith('__')
      ?await sb.from('project_state').upsert({project_id:ACTIVE_PROJECT_ID,key:stateKeyOf(d),value:data,updated_by:SESSION.user.id},{onConflict:'project_id,key'})
      :await sb.from('daily_reports').upsert({project_id:ACTIVE_PROJECT_ID,report_date:d,payload:data,author_id:SESSION.user.id},{onConflict:'project_id,report_date'});
    if(r.error)throw r.error;online=true;lastSync=stamp();
  }catch(e){online=false;toast('Enregistrement refusé par la base : '+(e?.message||e));}
  syncing=false;
}
async function syncDel(d){
  if(!canWrite()){toast('Lecture seule : suppression impossible.');return;}
  delete db[d];if(!isConfigured())return;
  const r=d.startsWith('__')
    ?await sb.from('project_state').delete().eq('project_id',ACTIVE_PROJECT_ID).eq('key',stateKeyOf(d))
    :await sb.from('daily_reports').delete().eq('project_id',ACTIVE_PROJECT_ID).eq('report_date',d);
  if(r.error)toast('Suppression refusée par la base : '+r.error.message);
}

// ── INDICE OPÉRATIONNEL PAR LOT ──
// Même grille que l'indice consolidé V1.5. Les anciens alias restent exposés
// dans detail pour préserver les vues et exports existants.
function avancementLot(lot,cuLot){
  const det={topographie:0,bardage:0,assemblage:0,ouverture:0,fermeture:0,gc:0,essais:0,rincage:0,recolement:0,
    imp:0,bar:0,soud:0,fou:0,rem:0,ess:0,rec:0};
  // Implantation : oui/non au niveau lot (dans cuLot.imp si présent, sinon 0)
  det.topographie=Math.min(1,Math.max(0,cuLot.imp||0))*100;
  // Toutes les activités linéaires sont plafonnées à la maille zone/DN.
  // Un dépassement sur un diamètre ne peut donc pas compenser un retard ailleurs.
  let barTot=0,soudTot=0,fouTot=0,poseTot=0,essTot=0;
  lot.zones.forEach(zn=>{
    const zc=cuLot.zones?.[zn.zid];if(!zc)return;
    Object.keys(zn.dn).forEach(dn=>{
      const dc=zc.dn?.[dn]||{};
      barTot+=Math.min(+dc.bar||0,zn.dn[dn]);
      soudTot+=Math.min(Math.max(+dc.s||0,0),zn.dn[dn]);
      fouTot+=Math.min(Math.max(+dc.f||0,0),zn.dn[dn]);
      poseTot+=Math.min(Math.max(+dc.r||0,0),zn.dn[dn]);
      essTot+=Math.min(+dc.ess||0,zn.dn[dn]);
    });
  });
  det.bardage=lot.tot>0?(barTot/lot.tot)*100:0;
  det.essais=lot.tot>0?(essTot/lot.tot)*100:0;
  det.assemblage=lot.tot>0?soudTot/lot.tot*100:0;
  det.ouverture=lot.tot>0?fouTot/lot.tot*100:0;
  det.fermeture=lot.tot>0?poseTot/lot.tot*100:0;
  // GC (regards) : compteur réalisé / total (uniquement si lot.regards > 0)
  if(lot.regards>0){
    det.gc=Math.min(1,(cuLot.gcProgress??cuLot.gc??0)/lot.regards)*100;
  }
  det.rincage=cuLot.rincageStatus==='valide'?100:0;
  det.recolement=cuLot.recolementStatus==='valide'?100:0;
  // Un lot sans regard est évalué sur les composantes qui lui sont applicables.
  // Alias historiques utilisés par certaines vues.
  Object.assign(det,{imp:det.topographie,bar:det.bardage,soud:det.assemblage,fou:det.ouverture,rem:det.fermeture,ess:det.essais,rec:det.recolement});
  return{pc:normalizedPhysicalIndex(det,lot.regards>0),detail:det};
}

function normalizedPhysicalIndex(rates,gcApplicable=true){const keys=Object.keys(PHYSICAL_WEIGHTS).filter(k=>k!=='gc'||gcApplicable),weight=keys.reduce((s,k)=>s+(+PHYSICAL_WEIGHTS[k]||0),0),weighted=keys.reduce((s,k)=>s+(+PHYSICAL_WEIGHTS[k]||0)*(+rates[k]||0)/100,0);return weight>0?weighted/weight*100:0;}

// L'indice global reprend exactement la synthèse consolidée et sa grille V1.5.

// ── RÉFÉRENCE PHYSIQUE PROVISOIRE ──
// Mesure le linéaire dont le cycle de pose est refermé : remblai cumulé, plafonné
// au marché pour chaque DN. Les essais et regards restent affichés séparément.
// Cette valeur n'est PAS un avancement financier.
function avancementPhysiqueLot(lot,cuLot){
  let remblaiValide=0;
  lot.zones.forEach(zn=>{
    Object.keys(zn.dn).forEach(dn=>{
      const valeur=+(cuLot.zones?.[zn.zid]?.dn?.[dn]?.r||0);
      remblaiValide+=Math.min(Math.max(valeur,0),zn.dn[dn]);
    });
  });
  return lot.tot>0?(remblaiValide/lot.tot)*100:0;
}
function avancementPhysique(cu){
  const tPglob=LOC.reduce((s,l)=>s+l.tot,0);
  let sumPondere=0;
  LOC.forEach(l=>{
    sumPondere+=avancementPhysiqueLot(l,cu[l.id])*(l.tot/tPglob);
  });
  return sumPondere;
}

// Synthèse physique V1.5 destinée à la première zone du tableau de bord.
// Les mouvements sont plafonnés par zone/DN afin qu'une correction ou un
// dépassement local ne puisse pas gonfler l'avancement du projet.
function dashboardPhysicalSummary(cu){
  const tP=LOC.reduce((s,l)=>s+l.tot,0);
  const totals={bar:0,soud:0,fou:0,rem:0,ess:0};
  let topoLength=0,gcDone=0,gcProgressTotal=0,gcTotal=0,recolementDone=0,recolementLength=0;
  LOC.forEach(l=>{
    topoLength+=Math.min(1,Math.max(0,+(cu[l.id]?.imp||0)))*l.tot;
    if(+(cu[l.id]?.rec||0)>=1){recolementDone++;recolementLength+=l.tot;}
    if(l.regards>0){
      gcTotal+=l.regards;
      gcDone+=Math.min(Math.max(+(cu[l.id]?.gc||0),0),l.regards);
      gcProgressTotal+=Math.min(Math.max(+(cu[l.id]?.gcProgress||0),0),l.regards);
    }
    l.zones.forEach(zn=>Object.keys(zn.dn).forEach(dn=>{
      const prevu=+zn.dn[dn]||0;
      const dc=cu[l.id]?.zones?.[zn.zid]?.dn?.[dn]||{};
      totals.bar+=Math.min(Math.max(+dc.bar||0,0),prevu);
      totals.soud+=Math.min(Math.max(+dc.s||0,0),prevu);
      totals.fou+=Math.min(Math.max(+dc.f||0,0),prevu);
      totals.rem+=Math.min(Math.max(+dc.r||0,0),prevu);
      totals.ess+=Math.min(Math.max(+dc.ess||0,0),prevu);
    }));
  });
  const rdLength=LOC.filter(l=>cu[l.id]?.rincageStatus==='valide').reduce((s,l)=>s+l.tot,0);
  const pctOfTotal=v=>tP>0?Math.min(100,Math.max(0,v/tP*100)):0;
  const rates={
    topographie:pctOfTotal(topoLength),
    bardage:pctOfTotal(totals.bar),
    assemblage:pctOfTotal(totals.soud),
    ouverture:pctOfTotal(totals.fou),
    fermeture:pctOfTotal(totals.rem),
    gc:gcTotal>0?Math.min(100,gcProgressTotal/gcTotal*100):0,
    essais:pctOfTotal(totals.ess),
    rincage:pctOfTotal(rdLength),
    recolement:LOC.length>0?Math.min(100,recolementDone/LOC.length*100):0
  };
  const applicableKeys=Object.keys(PHYSICAL_WEIGHTS).filter(k=>k!=='gc'||gcTotal>0),index=normalizedPhysicalIndex(rates,gcTotal>0);
  return{tP,totals,topoLength,gcDone,gcProgressTotal,gcTotal,rdLength,recolementDone,recolementLength,rates,index,applicableKeys};
}

// L'avancement financier provient exclusivement du dernier attachement validé.
// Un brouillon ou un ajustement non validé ne doit jamais modifier le tableau de bord.
function validatedAttachmentSnapshot(period){
  if(!period)return null;
  if(period.status==='validated')return period;
  const history=[...(period.history||[])].reverse().find(h=>h.status==='validated');
  return history?{...period,status:'validated',revision:history.revision||'Validé',validatedAt:history.validatedAt||null,values:{...(history.values||{})},manual:{}}:null;
}
function dernierAttachementValide(){

  return Object.values(ATTACH_XLS.periods).map(validatedAttachmentSnapshot).filter(Boolean).sort((a,b)=>a.key.localeCompare(b.key)).at(-1)||null;
}
function financeSummaryAsSynthese(){const s=db?.__finance_summary__;if(!Number.isFinite(+s?.taux))return null;return{period:{key:s.period?.key||'',number:s.period?.number||null,label:s.period?.label||''},taux:+s.taux,marche:null,cumul:null,shared:true};}

    const grossMarket=lines.reduce((s,l)=>s+(+l.marketQty||0)*(+l.unitPrice||0),0),grossCumulative=lines.reduce((s,l)=>s+(genericAttachmentLineValues(period,l).cumulativeAmount||0),0),marche=grossMarket*(1-discount)*(1-retention),cumul=grossCumulative*(1-discount)*(1-retention);

function countNegativeMovements(report){
  if(!report?.loc)return 0;
  let count=0;
  Object.values(report.loc).forEach(loc=>{
    if(typeof loc?.topoDay==='number'&&loc.topoDay<0)count++;
    Object.values(loc.zones||{}).forEach(zone=>{
      Object.values(zone||{}).forEach(dn=>{
        ['s','f','r','ess','bar','barDay'].forEach(k=>{if(typeof dn?.[k]==='number'&&dn[k]<0)count++;});
      });
    });
  });
  return count;
}

function validateCorrectionMetadata(report){
  const negatives=countNegativeMovements(report);
  if(negatives>0&&report.kind!=='correction')return`Des valeurs négatives sont présentes. Sélectionnez « Correction de données » et indiquez le motif.`;
  if(report.kind==='correction'&&(report.correctionReason||'').trim().length<8)return`Le motif de correction doit contenir au moins 8 caractères.`;
  return'';
}

// Indicateurs de qualité utiles pour expliquer les écarts entre les cumuls bruts
// et la référence physique. Aucune donnée historique n'est supprimée ou réécrite.
function dataQualitySummary(cu){
  let remblaiBrut=0,remblaiPlafonne=0,dnDepasses=0;
  LOC.forEach(l=>l.zones.forEach(zn=>Object.keys(zn.dn).forEach(dn=>{
    const prevu=+zn.dn[dn]||0;
    const brut=+(cu[l.id]?.zones?.[zn.zid]?.dn?.[dn]?.r||0);
    remblaiBrut+=brut;
    remblaiPlafonne+=Math.min(Math.max(brut,0),prevu);
    if(brut>prevu+0.01)dnDepasses++;
  })));
  let mouvementsNegatifs=0,rapportsCorrection=0;
  dbDates().forEach(d=>{
    const n=countNegativeMovements(db[d]);
    mouvementsNegatifs+=n;
    if(n>0||db[d]?.kind==='correction')rapportsCorrection++;
  });
  return{
    remblaiBrut,
    remblaiPlafonne,
    ecartPlafonnement:Math.max(0,remblaiBrut-remblaiPlafonne),
    dnDepasses,
    mouvementsNegatifs,
    rapportsCorrection
  };
}

// ── CUMUL ENGINE ──
// v2: étendu avec bar, ess, imp, gc, rec (rétrocompatible)
function cumul(upTo){
  const dates=dbDates().filter(d=>d<=upTo).sort(),c={},migratedRinse=migratedRinseLocalities(upTo);
  LOC.forEach(l=>{
    const regardStages={};
    for(let i=0;i<(l.regards||0);i++)regardStages[regardId(l,i)]='non_demarre';
    c[l.id]={t:0,s:0,f:0,r:0,imp:0,topoMl:0,gc:0,gcProgress:0,rec:0,
      regardStages,rincageStatus:migratedRinse.has(l.id)?'valide':'non_demarre',recolementStatus:'non_demarre',zones:{}};
    l.zones.forEach(zn=>{
      c[l.id].zones[zn.zid]={s:0,f:0,r:0,dn:{}};
      Object.keys(zn.dn).forEach(d=>{c[l.id].zones[zn.zid].dn[d]={s:0,f:0,r:0,bar:0,ess:0};});
    });
  });
  // Migration du prototype existant uniquement : les données de préparation déjà
  // validées restent figées. Un nouveau projet part de zéro et les saisit au jour le jour.
  if(PROJECT_CONFIG.migration?.legacyPreparationFrozen&&upTo>=ETAT_INITIAL_DATE){
    LOC.forEach(l=>{
      c[l.id].topoMl=l.tot;c[l.id].imp=1;
      const ei=ETAT_INITIAL[l.id];

            const eiDn=ei.zones[zn.zid]?.[dn];

  dates.forEach(dt=>{const rp=db[dt];if(!rp?.loc)return;
    LOC.forEach(l=>{const el=rp.loc[l.id];if(!el)return;c[l.id].t+=(+el.t||0);
      if(el.topoDay!==undefined){c[l.id].topoMl+=(+el.topoDay||0);c[l.id].imp=l.tot>0?Math.min(1,Math.max(0,c[l.id].topoMl/l.tot)):0;}
      else if(el.imp!==undefined){c[l.id].imp=Math.max(c[l.id].imp,+el.imp||0);c[l.id].topoMl=Math.max(c[l.id].topoMl,c[l.id].imp*l.tot);}
      if(el.gc!==undefined)c[l.id].gc=Math.max(c[l.id].gc,+el.gc||0);
      if(el.rec!==undefined){c[l.id].rec=Math.max(c[l.id].rec,+el.rec||0);if(+el.rec)c[l.id].recolementStatus='valide';}

        if(GC_STAGES[stage]&&c[l.id].regardStages[rid]!==undefined)c[l.id].regardStages[rid]=stage;

      const rinseStatus=typeof rinseUpdate==='string'?rinseUpdate:rinseUpdate?.status;
      if(RINSE_STATUSES[rinseStatus])c[l.id].rincageStatus=rinseStatus;
      const recoUpdate=finish.recolement?.[l.id];
      const recoStatus=typeof recoUpdate==='string'?recoUpdate:recoUpdate?.status;
      if(RECO_STATUSES[recoStatus])c[l.id].recolementStatus=recoStatus;
      l.zones.forEach(zn=>{const ez=el.zones?.[zn.zid];if(!ez)return;
        Object.keys(zn.dn).forEach(d=>{
          const ed=ez[d]||{};
          // Soud/Fou/Rem : cumul journalier (somme)

          c[l.id].zones[zn.zid].dn[d].f+=(+ed.f||0);
          c[l.id].zones[zn.zid].dn[d].r+=(+ed.r||0);

          if(ed.bar!==undefined)c[l.id].zones[zn.zid].dn[d].bar=Math.max(c[l.id].zones[zn.zid].dn[d].bar,+ed.bar||0);

// ── COHERENCE ENGINE ──
// Checks cumul data for physical impossibilities
// Rules: R_cumul ≤ F_cumul AND R_cumul ≤ S_cumul (per zone/DN)
function checkCoherence(cu){
  const alerts=[];
  LOC.forEach(l=>{
    const lc=cu[l.id];if(!lc)return;
    if(lc.r>lc.f+0.5&&lc.r>0)alerts.push({loc:l.nm,zone:'',dn:'',type:'R>F',s:lc.s,f:lc.f,r:lc.r,excess:+(lc.r-lc.f).toFixed(1),level:'loc'});
    if(lc.r>lc.s+0.5&&lc.r>0)alerts.push({loc:l.nm,zone:'',dn:'',type:'R>S',s:lc.s,f:lc.f,r:lc.r,excess:+(lc.r-lc.s).toFixed(1),level:'loc'});
    l.zones.forEach(zn=>{const zc=lc.zones?.[zn.zid];if(!zc)return;
      Object.keys(zn.dn).forEach(dn=>{const dc=zc.dn?.[dn];if(!dc)return;
        if(dc.r>dc.f+0.5&&dc.r>0)alerts.push({loc:l.nm,zone:zn.zid!=='_'?zn.nm:'',dn,type:'R>F',s:dc.s,f:dc.f,r:dc.r,excess:+(dc.r-dc.f).toFixed(1),level:'dn'});
        if(dc.r>dc.s+0.5&&dc.r>0)alerts.push({loc:l.nm,zone:zn.zid!=='_'?zn.nm:'',dn,type:'R>S',s:dc.s,f:dc.f,r:dc.r,excess:+(dc.r-dc.s).toFixed(1),level:'dn'});
      });});});
  return alerts.sort((a,b)=>b.excess-a.excess);}

// Safe cumul: cap R at min(S,F) without modifying stored data
function safeCumul(cu){
  const sc=JSON.parse(JSON.stringify(cu));
  LOC.forEach(l=>{
    l.zones.forEach(zn=>{const zc=sc[l.id].zones?.[zn.zid];if(!zc)return;
      Object.keys(zn.dn).forEach(dn=>{const dc=zc.dn?.[dn];if(!dc)return;
        dc.r=Math.min(dc.r,dc.f,dc.s);if(dc.r<0)dc.r=0;});
      zc.r=Object.values(zc.dn).reduce((a,b)=>a+b.r,0);});
    sc[l.id].r=Object.values(sc[l.id].zones).reduce((a,b)=>a+b.r,0);});
  return sc;}

async function init(){
  document.title='SIYO Pilot';
  if(!supabaseConfigured()){V='login';draw();return;}
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  const {data:{session}}=await sb.auth.getSession();
  sb.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_OUT')location.reload();});
  if(!session){V='login';draw();return;}
  await afterLogin(session);
}
async function afterLogin(session){
  SESSION=session;
  const {data:p}=await sb.from('profiles').select('id,full_name,email,is_admin').eq('id',session.user.id).single();
  PROFILE=p||{id:session.user.id,email:session.user.email,is_admin:false};
  await loadRegistryFromSupabase();
  if(!PROJECT_REGISTRY.projects.length){V='projects';draw();return;}
  const remembered=PROJECT_REGISTRY.projects.some(p=>p.id===ACTIVE_PROJECT_ID)?ACTIVE_PROJECT_ID:DEFAULT_PROJECT_ID;
  V='projects';draw();
  if(remembered)await switchProject(remembered,'projects',true);
}
async function login(){
  const email=document.getElementById('login_email')?.value.trim(),password=document.getElementById('login_password')?.value;
  const msg=document.getElementById('login_msg');if(!email||!password){if(msg)msg.textContent='Adresse et mot de passe requis.';return;}
  const btn=document.getElementById('login_btn');if(btn)btn.disabled=true;
  const {data,error}=await sb.auth.signInWithPassword({email,password});
  if(error){if(btn)btn.disabled=false;if(msg)msg.textContent='Identifiants refusés ou compte non autorisé.';return;}
  await afterLogin(data.session);
}
async function logout(){if(sb)await sb.auth.signOut();else location.reload();}
window.login=login;window.logout=logout;

function reportFinishingRows(rp,zoneFilter=''){
  const rows=[];
  LOC.filter(l=>!zoneFilter||l.z===zoneFilter).forEach(l=>{
    const fin=rp?.finitions||{};
    const meta=fin.gcMeta?.[l.id]||{};
    Object.entries(fin.regards?.[l.id]||{}).forEach(([rid,value])=>{
      const stage=typeof value==='string'?value:value?.stage;
      if(!stage)return;
      rows.push({type:'Regard GC',localite:l.nm,ouvrage:rid.split('-').pop(),etat:stageLabel(stage),reference:meta.reference||'',note:meta.note||''});
    });
    const rinse=fin.rincage?.[l.id];
    const rinseStatus=typeof rinse==='string'?rinse:rinse?.status;
    if(rinseStatus)rows.push({type:'Rinçage-désinfection',localite:l.nm,ouvrage:'Localité',etat:RINSE_STATUSES[rinseStatus]||rinseStatus,reference:rinse?.reference||'',note:''});
    const reco=fin.recolement?.[l.id];
    const recoStatus=typeof reco==='string'?reco:reco?.status;
    if(recoStatus)rows.push({type:'Plan de récolement',localite:l.nm,ouvrage:'Localité',etat:RECO_STATUSES[recoStatus]||recoStatus,reference:reco?.reference||'',note:''});
  });
  return rows;
}

function zonePhysicalSummary(zone,cu){
  const locs=LOC.filter(l=>l.z===zone);
  const planned=locs.reduce((s,l)=>s+l.tot,0);
  const totals={soud:0,fou:0,pose:0,ess:0};
  let gcTotal=0,gcDone=0,gcProgress=0,rinseLength=0,recoDone=0;
  locs.forEach(l=>{
    const c=cu[l.id];
    l.zones.forEach(zn=>Object.keys(zn.dn).forEach(dn=>{
      const ref=+zn.dn[dn]||0,dc=c?.zones?.[zn.zid]?.dn?.[dn]||{};
      totals.soud+=Math.min(Math.max(+dc.s||0,0),ref);
      totals.fou+=Math.min(Math.max(+dc.f||0,0),ref);
      totals.pose+=Math.min(Math.max(+dc.r||0,0),ref);
      totals.ess+=Math.min(Math.max(+dc.ess||0,0),ref);
    }));
    if(l.regards>0){gcTotal+=l.regards;gcDone+=Math.min(c?.gc||0,l.regards);gcProgress+=Math.min(c?.gcProgress||0,l.regards);}
    if(c?.rincageStatus==='valide')rinseLength+=l.tot;
    if(c?.recolementStatus==='valide')recoDone++;
  });
  const rate=v=>planned>0?Math.min(100,Math.max(0,v/planned*100)):0;
  return{locs,planned,totals,gcTotal,gcDone,gcProgress,rinseLength,recoDone,
    rates:{soud:rate(totals.soud),fou:rate(totals.fou),pose:rate(totals.pose),ess:rate(totals.ess),rinse:rate(rinseLength),gc:gcTotal?Math.min(100,gcProgress/gcTotal*100):0,reco:locs.length?Math.min(100,recoDone/locs.length*100):0}};
}
function lotRetainedTotals(lot,cuLot){
  const out={soud:0,fou:0,pose:0,ess:0};
  lot.zones.forEach(zn=>Object.keys(zn.dn).forEach(dn=>{
    const ref=+zn.dn[dn]||0,dc=cuLot?.zones?.[zn.zid]?.dn?.[dn]||{};
    out.soud+=Math.min(Math.max(+dc.s||0,0),ref);
    out.fou+=Math.min(Math.max(+dc.f||0,0),ref);
    out.pose+=Math.min(Math.max(+dc.r||0,0),ref);
    out.ess+=Math.min(Math.max(+dc.ess||0,0),ref);
  }));
  return out;
}

function collect(){const d={loc:{},eff:{},logistique:{},finitions:{regards:{},gcMeta:{},rincage:{},recolement:{}},contraintes:[],rmq:'',dt:SD,kind:document.getElementById('report_kind')?.value||'production',correctionReason:document.getElementById('correction_reason')?.value||''};
  LOC.forEach(l=>{
    const previous=db[SD]?.loc?.[l.id]||{};
    const zones={};
    l.zones.forEach(zn=>{
      const zd={};
      Object.keys(zn.dn).forEach(dn=>{
        const barRaw=document.getElementById(`bar_${l.id}_${zn.zid}_${dn}`)?.value??'';
        zd[dn]={
          s:+(document.getElementById(`s_${l.id}_${zn.zid}_${dn}`)?.value)||0,
          f:+(document.getElementById(`f_${l.id}_${zn.zid}_${dn}`)?.value)||0,
          r:+(document.getElementById(`r_${l.id}_${zn.zid}_${dn}`)?.value)||0,
          ess:+(document.getElementById(`ess_${l.id}_${zn.zid}_${dn}`)?.value)||0
        };
        if(barRaw!=='')zd[dn].barDay=+barRaw||0;
        const previousDn=previous.zones?.[zn.zid]?.[dn]||{};
        if(previousDn.bar!==undefined&&previousDn.barDay===undefined)zd[dn].bar=previousDn.bar;
      });
      zones[zn.zid]=zd;
    });
    const topoRaw=document.getElementById('topo_'+l.id)?.value??'';
    d.loc[l.id]={zones,p:cleanText(document.getElementById('p_'+l.id)?.value||'',500)};
    if(topoRaw!=='')d.loc[l.id].topoDay=+topoRaw||0;
    if(previous.imp!==undefined&&previous.topoDay===undefined&&topoRaw==='')d.loc[l.id].imp=previous.imp;
    if(previous.gc!==undefined)d.loc[l.id].gc=previous.gc;
    if(previous.rec!==undefined)d.loc[l.id].rec=previous.rec;
    d.eff[l.id]={f:+(document.getElementById('ef_'+l.id)?.value)||0,s:+(document.getElementById('es_'+l.id)?.value)||0,n:cleanText(document.getElementById('en_'+l.id)?.value||'',300)};
  });
  ZN.forEach(zone=>{d.logistique[zone]={km_matin:+(document.getElementById('lg_km1_'+zone)?.value)||0,km_soir:+(document.getElementById('lg_km2_'+zone)?.value)||0,carburant:+(document.getElementById('lg_carb_'+zone)?.value)||0,remarques:cleanText(document.getElementById('lg_rmq_'+zone)?.value||'',500)};});
  LOC.forEach(l=>{
    if(l.regards>0){
      const updates={};
      for(let i=0;i<l.regards;i++){
        const stage=document.getElementById(`gcs_${l.id}_${i}`)?.value||'';
        if(stage)updates[regardId(l,i)]={stage};
      }
      if(Object.keys(updates).length)d.finitions.regards[l.id]=updates;
      const note=cleanText(document.getElementById('gcn_'+l.id)?.value||'',500);
      const reference=cleanText(document.getElementById('gcr_'+l.id)?.value||'',300);
      if(note||reference)d.finitions.gcMeta[l.id]={note,reference};
    }
    const rinseStatus=document.getElementById('rin_'+l.id)?.value||'';
    const recoStatus=document.getElementById('recs_'+l.id)?.value||'';
    const finishReference=cleanText(document.getElementById('finref_'+l.id)?.value||'',300);
    if(rinseStatus)d.finitions.rincage[l.id]={status:rinseStatus,reference:finishReference};
    if(recoStatus)d.finitions.recolement[l.id]={status:recoStatus,reference:finishReference};
  });
  document.querySelectorAll('.contrainte-row').forEach(row=>{
    const i=+row.dataset.index;
    const observation=cleanText(document.getElementById('ct_obs_'+i)?.value||'',1500);
    const cause=document.getElementById('ct_cause_'+i)?.value||'';
    const activite=document.getElementById('ct_act_'+i)?.value||'';

    d.contraintes.push({
      legacyId:document.getElementById('ct_legacy_'+i)?.value||'',
      dateFait:document.getElementById('ct_datefait_'+i)?.value||SD,
      dureeJours:+(document.getElementById('ct_days_'+i)?.value)||0,
      source:document.getElementById('ct_source_'+i)?.value||'rapport',
      localite:document.getElementById('ct_loc_'+i)?.value||'tous',activite,effet,cause,
      statut:document.getElementById('ct_stat_'+i)?.value||'ponctuelle',
      imputabilite:document.getElementById('ct_imp_'+i)?.value||'analyser',
      observation,moyens:cleanText(document.getElementById('ct_moy_'+i)?.value||'',500),
      action:cleanText(document.getElementById('ct_action_'+i)?.value||'',1000),
      reference:cleanText(document.getElementById('ct_ref_'+i)?.value||'',500)
    });
  });
  d.rmq=cleanText(document.getElementById('rmq')?.value||'RAS',2000)||'RAS';return d;}
function constraintValidationError(data){
  const incomplete=data.contraintes.find(c=>!c.observation||!c.activite||!c.effet||!c.cause);
  if(incomplete)return'Une contrainte est incomplète. Renseignez l’activité, l’effet, la cause et le fait observé.';
  const invalidDuration=data.contraintes.find(c=>c.dureeJours&&(!Number.isInteger(c.dureeJours)||c.dureeJours<1));
  if(invalidDuration)return'La durée d’une contrainte doit être un nombre entier de jours.';
  const closedWithoutDays=data.contraintes.find(c=>c.statut!=='en_cours'&&(!Number.isInteger(c.dureeJours)||c.dureeJours<1));
  if(closedWithoutDays)return'Une contrainte levée ou ponctuelle doit avoir une durée minimale de 1 jour.';
  return'';
}
async function save(){
  if(!canWrite()){toast('Lecture seule : ce rôle ne peut pas enregistrer.');return;}
  const data=collect();
  const constraintError=constraintValidationError(data);
  if(constraintError){alert('⚠️ '+constraintError);return;}
  const correctionError=validateCorrectionMetadata(data);
  if(correctionError){alert('⚠️ '+correctionError);return;}
  const alerts=validateSave(data);
  if(alerts.length){
    const top5=alerts.slice(0,5);
    const msg=top5.map(a=>`${a.loc}${a.zone?' '+a.zone:''}${a.dn?' DN'+a.dn:''}: ${a.type==='R>F'?'R('+fmt(a.r)+')>F('+fmt(a.f)+')':'R('+fmt(a.r)+')>S('+fmt(a.s)+')'} +${fmt(a.excess)}ml`).join('\n');
    if(!confirm(`⚠️ ${alerts.length} incohérence${alerts.length>1?'s':''} détectée${alerts.length>1?'s':''}:\n\n${msg}${alerts.length>5?'\n... et '+(alerts.length-5)+' autres':''}\n\nEnregistrer quand même ?`))return;
  }
  await syncSave(SD,data);toast('✅ Enregistré'+(online?' (sync)':' (local)'));draw();}
async function saveGo(){
  const data=collect();
  const constraintError=constraintValidationError(data);
  if(constraintError){alert('⚠️ '+constraintError);return;}
  const correctionError=validateCorrectionMetadata(data);
  if(correctionError){alert('⚠️ '+correctionError);return;}
  const alerts=validateSave(data);
  if(alerts.length){
    const top5=alerts.slice(0,5);
    const msg=top5.map(a=>`${a.loc}${a.dn?' DN'+a.dn:''}: ${a.type} +${fmt(a.excess)}ml`).join('\n');
    if(!confirm(`⚠️ ${alerts.length} incohérence${alerts.length>1?'s':''}:\n${msg}\n\nEnregistrer ?`))return;
  }
  await syncSave(SD,data);V='rapport';draw();}

function renderReportConstraints(date,rp){
  const contraintesJour=constraintsForReport(date,rp);
  if(!contraintesJour.length)return'';
  let h=`<div class="st">Contraintes et faits marquants</div><div class="cd constraint-report-list">`;
  contraintesJour.forEach(c=>{
    const loc=c.localite==='tous'?'Ensemble du chantier':(LOC.find(l=>l.id===c.localite)?.nm||c.localite);
    const durationDays=constraintDurationDays(c);
    h+=`<div class="constraint-report-item">
      <div class="constraint-report-top"><b>${escHtml(loc)} · ${escHtml(CONTRAINTE_ACTIVITES[c.activite]||c.activite||'Activité non précisée')}</b><span class="constraint-effect constraint-effect--${c.effet}">${escHtml(CONTRAINTE_EFFETS[c.effet]||c.effet||'Effet non précisé')}</span></div>

      ${c.moyens||c.action||c.reference?`<div class="constraint-report-detail">${c.moyens?`<span><b>Moyens :</b> ${escHtml(c.moyens)}</span>`:''}${c.action?`<span><b>Action :</b> ${escHtml(c.action)}</span>`:''}${c.reference?`<span><b>Référence :</b> ${escHtml(c.reference)}</span>`:''}</div>`:''}

}

    if(lg.remarques&&lg.remarques!=='RAS')h+=`<div style="font-size:12px;color:#5a6778">📝 ${lg.remarques}</div>`;
    h+=`</div>`;});}

  h+=`<div class="cd" style="border-left:4px solid #36b37e"><div class="ct" style="color:#36b37e">📝 Remarques</div><div style="font-size:13px;color:#5a6778;white-space:pre-wrap">${escHtml(rp.rmq||'RAS')}</div></div>`;

// ── WHATSAPP ──
function pgWhatsapp(){

  let h=`<div class="mn"><div class="st">Rapport WhatsApp</div>
    <div class="cd wa-controls"><div><label class="fl">Date</label><select class="fi" style="width:220px" onchange="SD=this.value;draw()">${dates.map(d=>`<option value="${d}" ${d===SD?'selected':''}>${fD(d)}</option>`).join('')}</select></div>

  if(!rp)return h+`<div class="cd" style="text-align:center;padding:40px;color:#8a95a5">Aucun rapport disponible</div></div>`;

  ZN.forEach(zone=>{
    const zs=zonePhysicalSummary(zone,cu),locs=zs.locs;

    const km=(lg.km_soir||0)-(lg.km_matin||0);

    let txt=`*📊 RAPPORT D'AVANCEMENT — WHATSAPP*\n`;
    txt+=`*Projet :* ${projectShortName()}\n`;
    txt+=`*Date :* ${fD(SD)}\n`;
    txt+=`*Zone :* ${zone}\n`;
    txt+=`*Statut :* ${reportStatus}\n`;
    if(rp.kind==='correction'||countNegativeMovements(rp))txt+=`*Nature :* CORRECTION DE DONNÉES — ${(rp.correctionReason||'motif historique non documenté').trim()}\n`;

      if(pcs)lines.push(`  ▸ Pièces et raccords: ${pcs}`);

    if(!activeLocalities)txt+=`  ▸ Aucune production linéaire renseignée dans la zone.\n\n`;

        txt+=`  ▸ ${r.localite} — ${r.type}${r.ouvrage!=='Localité'?' '+r.ouvrage:''}: *${r.etat}*${r.note?' · '+r.note:''}${r.reference?' · Réf. '+r.reference:''}\n`;
      });
      txt+='\n';
    }
    txt+=`━━━━━━━━━━━━━━━━━━\n`;
    txt+=`*${sectionNo++}. SITUATION D'AVANCEMENT*\n\n`;

// Group daily productions by month
function groupByMonth(){
  const months={};
  dbDates().sort().forEach(d=>{
    const m=d.slice(0,7); // YYYY-MM
    if(!months[m])months[m]={s:0,f:0,r:0,days:0};
    const rp=db[d];if(!rp?.loc)return;
    months[m].days++;
    LOC.forEach(l=>{const dt=dayTot(rp,l.id);months[m].s+=dt.s;months[m].f+=dt.f;months[m].r+=dt.r;});
  });
  return months;
}

// Cadence effective du chantier : médiane des 20 derniers jours productifs.
// Les journées sans pose ne sont pas intégrées ici car les arrêts sont traités
// séparément par la date de reprise. Cette cadence décrit le dispositif réel,
// pas la performance théorique d'une équipe isolée.
function cadencePoseObservee(limit=20){
  const valeurs=dbDates().sort().map(d=>{
    let total=0;LOC.forEach(l=>{total+=Math.max(0,dayTot(db[d],l.id).r);});return total;
  }).filter(v=>v>0).slice(-limit).sort((a,b)=>a-b);
  if(!valeurs.length)return 0;
  const m=Math.floor(valeurs.length/2);
  return valeurs.length%2?valeurs[m]:(valeurs[m-1]+valeurs[m])/2;
}

function cadencePoseRetenue(settings){
  if(settings.poseRateSource==='planning')return CADENCE_POSE_PLANNING;
  if(settings.poseRateSource==='manual')return +settings.manualPoseRate||0;
  return cadencePoseObservee()||CADENCE_POSE_PLANNING;
}

function addCalendarDays(dateStr,days){
  const d=new Date(dateStr+'T00:00:00Z');
  d.setUTCDate(d.getUTCDate()+Math.max(0,Math.ceil(days)));
  return d.toISOString().slice(0,10);
}
function calendarDiff(a,b){
  return Math.round((new Date(b+'T00:00:00Z')-new Date(a+'T00:00:00Z'))/86400000);
}

// Projection volontairement lisible et prudente :
// pose -> essais -> raccordements -> rinçage ; les regards avancent en parallèle ;
// les plans de récolement sont ajoutés en clôture lorsqu'une durée est renseignée.
function projectionCadences(synth,settings){
  const tP=LOC.reduce((s,l)=>s+l.tot,0);
  const restePose=Math.max(0,tP-synth.totals.rem);
  const resteEssais=Math.max(0,tP-synth.totals.ess);
  const poseRate=cadencePoseRetenue(settings);
  const poseDays=poseRate>0?Math.ceil(restePose/poseRate):null;
  const testDays=settings.testRate>0?Math.ceil(resteEssais/settings.testRate):null;
  // Le reste GC vient désormais des états saisis regard par regard. Une étape
  // partiellement réalisée réduit le reste en équivalent-regard, sans exposer
  // la pondération interne dans l'interface de saisie.
  const gcRemaining=Math.max(0,(synth.gcTotal||0)-(synth.gcProgressTotal||0));
  const gcDays=Math.ceil(gcRemaining*Math.max(0,settings.gcDaysPer));
  const networkDays=poseDays===null||testDays===null?null:
    poseDays+testDays+Math.ceil(settings.raccordDays)+Math.ceil(settings.rinseDays);
  const worksDays=networkDays===null?null:Math.max(networkDays,gcDays);
  const totalDays=worksDays===null?null:worksDays+Math.ceil(settings.recoDays);
  let date=null,deltaTarget=null;
  if(settings.restartMode==='date'&&settings.restartDate&&totalDays!==null){
    date=addCalendarDays(settings.restartDate,totalDays);
    if(settings.targetMode==='date'&&settings.targetDate)deltaTarget=calendarDiff(settings.targetDate,date);
  }

  let requiredPoseRate=null,requiredIncrease=null,targetImpossibleReason='';
  if(settings.restartMode==='date'&&settings.targetMode==='date'&&settings.restartDate&&settings.targetDate){
    const available=calendarDiff(settings.restartDate,settings.targetDate);
    const fixedNetwork=(testDays||0)+Math.ceil(settings.raccordDays)+Math.ceil(settings.rinseDays)+Math.ceil(settings.recoDays);
    const poseWindow=available-fixedNetwork;
    if(available<0)targetImpossibleReason='La reprise est postérieure à l’échéance.';
    else if(gcDays+Math.ceil(settings.recoDays)>available)targetImpossibleReason='La branche regards/récolement dépasse déjà l’échéance.';
    else if(poseWindow<=0)targetImpossibleReason='Aucun délai disponible pour achever la pose.';
    else{
      requiredPoseRate=restePose/poseWindow;
      requiredIncrease=poseRate>0?(requiredPoseRate/poseRate-1)*100:null;
    }
  }
  return{restePose,resteEssais,gcRemaining,poseRate,poseDays,testDays,gcDays,networkDays,totalDays,date,deltaTarget,requiredPoseRate,requiredIncrease,targetImpossibleReason};
}

// Cadence remblai sur les N derniers jours avec saisie (conservée pour affichage info)
// Retourne {mlParJour, joursActifs, totalPeriode}
function cadenceRecente(nbJours){
  const ds=dbDates().sort().reverse();
  if(!ds.length)return{mlParJour:0,joursActifs:0,totalPeriode:0};
  const refDate=new Date(ds[0]);
  const seuilDate=new Date(refDate);seuilDate.setDate(seuilDate.getDate()-nbJours+1);
  const seuilStr=seuilDate.toISOString().slice(0,10);
  let totalR=0,jActifs=0;
  ds.filter(d=>d>=seuilStr).forEach(d=>{
    const rp=db[d];if(!rp?.loc)return;
    let rJ=0;LOC.forEach(l=>{rJ+=dayTot(rp,l.id).r;});
    if(rJ>0){totalR+=rJ;jActifs++;}
  });
  return{mlParJour:jActifs>0?totalR/jActifs:0,joursActifs:jActifs,totalPeriode:totalR};
}

// Cadence PHYSIQUE : vitesse du linéaire remblayé en points / jour calendaire
// Calcule la différence de référence physique entre aujourd'hui et il y a nbJours
// Base = jours calendaires (pas seulement jours actifs) pour une projection honnête
function cadencePonderee(nbJours){
  const ds=dbDates().sort();
  if(!ds.length)return{ptsParJour:0,avActuel:0,avAncien:0};
  const ref=ds[ds.length-1]; // date du dernier rapport
  const refDate=new Date(ref);
  const seuilDate=new Date(refDate);seuilDate.setDate(seuilDate.getDate()-nbJours);
  const seuilStr=seuilDate.toISOString().slice(0,10);
  // Référence physique à la date de référence
  const cuActuel=cumul(ref);
  const avActuel=avancementPhysique(cuActuel);
  // Référence physique à nbJours avant la référence
  const cuAncien=cumul(seuilStr);
  const avAncien=avancementPhysique(cuAncien);
  const ptsParJour=(avActuel-avAncien)/nbJours;
  return{ptsParJour,avActuel,avAncien,dateRef:ref,dateSeuil:seuilStr};
}

// Projection date de fin basée sur la cadence physique remblayée.
// Elle n'est publiée que comme estimation de rythme, jamais comme engagement contractuel.
function projectionFin(){
  const cu=cumul('9999-12-31');
  const avActuel=avancementPhysique(cu);
  const reste=100-avActuel;
  if(reste<=0)return{date:null,joursRestants:0,termine:true};
  const cad=cadencePonderee(FENETRE_CADENCE_J);
  if(cad.ptsParJour<=0)return{date:null,joursRestants:null,termine:false,noCadence:true,avActuel};
  const joursCalendaires=Math.ceil(reste/cad.ptsParJour);
  const ds=dbDates().sort().reverse();
  const refDate=new Date(ds[0]);
  const finDate=new Date(refDate);finDate.setDate(finDate.getDate()+joursCalendaires);
  return{
    date:finDate.toISOString().slice(0,10),
    joursRestants:joursCalendaires,
    cadencePts:cad.ptsParJour,
    reste,
    avActuel,
    termine:false
  };
}

// Écart Réel/Objectif physique à date
// Interpolation linéaire de l'objectif au JOUR du dernier rapport.
// Exemple : au 17 avril, objectif fin mars=55,9% et fin avril=73,7%
// → progression intra-avril = 17/30 (jour du mois / jours du mois)
// → objectif au 17/04 = 55,9% + (73,7% − 55,9%) × 17/30 = 65,9%
// On compare ensuite ce point à la référence physique réelle.
function ecartObjectif(){
  const cu=cumul('9999-12-31');
  const pcReel=avancementPhysique(cu);
  if(PROJECT_CONFIG.planning?.mode==='manual'&&!(activePlanningVersion()?.rows||[]).length)return{pcReel:+pcReel.toFixed(1),pcObjectif:null,ecart:null,critique:false,dateRef:dbDates().sort().at(-1)||null,unavailable:true};
  const ds=dbDates().sort().reverse();
  if(!ds.length)return{pcReel:0,pcObjectif:0,ecart:0,critique:false,dateRef:null};
  const dateRef=ds[0]; // Date du dernier rapport (référence stable)
  const[yy,mm,jj]=dateRef.split('-').map(Number);
  // Mois précédent (fin du mois passé = début de l'interpolation)
  const moisPrec=new Date(yy,mm-2,1).toISOString().slice(0,7);
  // Mois en cours (fin du mois en cours = fin de l'interpolation)
  const moisEnCours=new Date(yy,mm-1,1).toISOString().slice(0,7);
  // Construire la courbe complète depuis décembre 2025 jusqu'au mois en cours
  const allMonths=[];
  const start=new Date('2025-12-01');
  const end=new Date(yy,mm-1,1); // 1er jour du mois en cours
  let d=new Date(start);
  while(d<=end){
    allMonths.push(d.toISOString().slice(0,7));
    d.setMonth(d.getMonth()+1);
  }
  const curve=buildPhysicalPlannedCurve(allMonths);
  // Récupérer les 2 valeurs de référence (fin mois précédent et fin mois en cours)
  const idxPrec=allMonths.indexOf(moisPrec);
  const idxEnCours=allMonths.indexOf(moisEnCours);
  const objFinMoisPrec=idxPrec>=0?curve[idxPrec]:0;
  const objFinMoisEnCours=idxEnCours>=0?curve[idxEnCours]:objFinMoisPrec;
  // Interpolation linéaire : ratio jour / jours-du-mois
  const joursDansMois=new Date(yy,mm,0).getDate(); // mm est 1-indexé pour Date(y,m,0) qui donne dernier jour du mois m-1
  const ratioJour=jj/joursDansMois;
  const pcObjectif=objFinMoisPrec+(objFinMoisEnCours-objFinMoisPrec)*ratioJour;
  const ecart=pcObjectif-pcReel; // positif = retard, négatif = avance
  return{
    pcReel:+pcReel.toFixed(1),
    pcObjectif:+pcObjectif.toFixed(1),
    ecart:+ecart.toFixed(1),
    critique:ecart>SEUIL_RETARD_CRITIQUE,
    dateRef,
    objFinMoisPrec:+objFinMoisPrec.toFixed(1),
    objFinMoisEnCours:+objFinMoisEnCours.toFixed(1),
    ratioJour:+(ratioJour*100).toFixed(0)
  };
}

// Tendance 7j vs 7j précédents sur la référence physique remblayée
// Compare : progression des 7 derniers jours vs progression des 7 jours précédents
// Base : jours CALENDAIRES (pas actifs) pour une évaluation honnête du rythme
function tendance7j(){
  const ds=dbDates().sort().reverse();
  if(!ds.length)return{delta7j:0,delta7j14:0,acceleration:0,evolution:'='};
  const ref=ds[0]; // dernier rapport
  const refDate=new Date(ref);
  const d7=new Date(refDate);d7.setDate(d7.getDate()-7);
  const d14=new Date(refDate);d14.setDate(d14.getDate()-14);
  const s7=d7.toISOString().slice(0,10);
  const s14=d14.toISOString().slice(0,10);
  // Référence physique aux 3 dates clés
  const avRef=avancementPhysique(cumul(ref));
  const av7=avancementPhysique(cumul(s7));
  const av14=avancementPhysique(cumul(s14));
  // Progression sur chaque fenêtre (en pts)
  const delta7j=avRef-av7;       // Progression des 7 derniers jours
  const delta7j14=av7-av14;      // Progression des 7 jours précédents
  // Accélération = différence de rythme entre les 2 fenêtres
  const acceleration=delta7j-delta7j14;
  return{
    delta7j:+delta7j.toFixed(2),
    delta7j14:+delta7j14.toFixed(2),
    acceleration:+acceleration.toFixed(2),
    avRef:+avRef.toFixed(1),
    evolution:acceleration>0.1?'↑':acceleration<-0.1?'↓':'='
  };
}

function objectifPhysiqueLot(lot,dateRef){
  const ref=new Date(dateRef);
  let mlPlanifies=0;
  PLAN_TASKS.filter(t=>t.lot===lot.id&&t.act==='pose').forEach(t=>{
    const d0=new Date(t.d0),d1=new Date(t.d1);
    const duree=Math.max(1,(d1-d0)/86400000);
    const avancee=Math.min(1,Math.max(0,(ref-d0)/86400000/duree));
    mlPlanifies+=(t.ml||0)*avancee;
  });
  return Math.min(mlPlanifies,lot.tot);
}

function cadenceRecenteLot(lid,nbJours){
  const ds=dbDates().sort();if(!ds.length)return 0;
  const ref=ds[ds.length-1],refDate=new Date(ref);
  const seuil=new Date(refDate);seuil.setDate(seuil.getDate()-nbJours+1);
  const seuilStr=seuil.toISOString().slice(0,10);
  let total=0;
  ds.filter(d=>d>=seuilStr&&d<=ref).forEach(d=>{total+=dayTot(db[d],lid).r;});
  return Math.max(0,total/nbJours);
}

// Retard physique estimatif par lot : remblai réel vs cycle de pose planifié.
function retardParLot(cu){
  const retards={};
  const ds=dbDates().sort().reverse();
  if(!ds.length){LOC.forEach(l=>retards[l.id]=null);return retards;}
  const dateRef=ds[0];
  LOC.forEach(l=>{
    const physiqueReel=avancementPhysiqueLot(l,cu[l.id])/100*l.tot;
    const theoriqueLot=objectifPhysiqueLot(l,dateRef);
    const retardMl=theoriqueLot-physiqueReel;
    if(retardMl<=0){retards[l.id]={jours:0,ml:0,avance:true};return;}
    const cadence=cadenceRecenteLot(l.id,FENETRE_CADENCE_J);
    const jours=cadence>0?Math.round(retardMl/cadence):null;
    retards[l.id]={jours,ml:Math.round(retardMl),avance:false};
  });
  return retards;
}

// Month name

  return noms[+m-1]+' '+y;
}

}

// Rendu du drill-down : détail d'une localité par DN et par mois
// Affiche : Mois × DN (production) + Total + Cumul progressif + comparaison vs prévu
function renderLocDetail(cu,mKeys,actLabels,actColors){
  if(!DG_LOC_DETAIL)return'';
  const loc=LOC.find(l=>l.id===DG_LOC_DETAIL);
  if(!loc)return'';
  const act=DG_ACT_PIVOT; // activité sélectionnée (s/f/r/ess)
  const clr=actColors[act];
  const actLbl=actLabels[act];
  // Collecter tous les DN du lot (fusion des zones)
  const allDN=new Set();
  loc.zones.forEach(zn=>Object.keys(zn.dn).forEach(dn=>allDN.add(dn)));
  const dns=[...allDN].sort((a,b)=>a-b);
  // Prévu par DN (somme sur toutes les zones)
  const prevuParDN={};
  dns.forEach(dn=>{prevuParDN[dn]=0;});
  loc.zones.forEach(zn=>Object.keys(zn.dn).forEach(dn=>{prevuParDN[dn]+=zn.dn[dn];}));
  const prevuTotal=loc.tot;
  // Production par mois et par DN pour l'activité choisie
  const prodParMoisDN={}; // {mois: {DN: val}}
  mKeys.forEach(m=>{prodParMoisDN[m]={};dns.forEach(dn=>{prodParMoisDN[m][dn]=0;});});
  dbDates().sort().forEach(d=>{
    const m=d.slice(0,7);
    if(!mKeys.includes(m))return;
    const rp=db[d];if(!rp?.loc?.[loc.id])return;
    loc.zones.forEach(zn=>{
      const ez=rp.loc[loc.id].zones?.[zn.zid];if(!ez)return;
      Object.keys(zn.dn).forEach(dn=>{
        prodParMoisDN[m][dn]+=(+ez[dn]?.[act]||0);
      });
    });
  });
  // Construction du HTML
  let h=`<div style="margin-top:14px;padding:14px;background:#f8fafc;border:1px solid #e2e8f0;border-left:4px solid ${clr};border-radius:8px;animation:slideDown .25s ease-out">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px">
      <div style="font-size:14px;font-weight:600;color:#0f1b2d">
        📍 ${loc.nm} — Détail ${actLbl} par DN${loc.zones.length>1?' <span style="font-size:10px;color:#8a95a5;font-weight:400">(toutes zones fusionnées)</span>':''}
      </div>
      <button style="font-size:11px;padding:4px 10px;border-radius:6px;cursor:pointer;background:#fff;color:#5a6778;border:1px solid #dce1e9" onclick="DG_LOC_DETAIL=null;draw()">✕ Fermer</button>
    </div>
    <div style="overflow-x:auto"><table class="tb"><thead><tr>
      <th>Mois</th>
      ${dns.map(dn=>`<th class="nr" style="font-size:10px"><span class="dntg" style="background:${DN_CLR[dn]||'#8a95a5'}15;color:${DN_CLR[dn]||'#8a95a5'};border:1px solid ${DN_CLR[dn]||'#8a95a5'}44">DN ${dn}</span></th>`).join('')}
      <th class="nr">Total mois</th>
    </tr></thead><tbody>`;
  // Lignes mois
  const totParDN={};dns.forEach(dn=>{totParDN[dn]=0;});
  mKeys.forEach(m=>{
    let totMois=0;
    h+=`<tr><td style="font-weight:600">${moisNm(m)}</td>`;
    dns.forEach(dn=>{
      const v=prodParMoisDN[m][dn]||0;
      totParDN[dn]+=v;totMois+=v;
      const hasValue=Math.abs(v)>0.001;
      h+=`<td class="nr" style="${hasValue?'color:'+(v<0?'#e74c3c':clr)+';font-weight:500':'color:#b8c2cc'}">${hasValue?fmt(Math.round(v)):'—'}</td>`;
    });
    const hasMonthValue=Math.abs(totMois)>0.001;
    h+=`<td class="nr" style="font-weight:600;color:${totMois<0?'#e74c3c':clr}">${hasMonthValue?fmt(Math.round(totMois)):'—'}</td></tr>`;
  });
  // Ligne TOTAL réalisé
  h+=`<tr style="font-weight:700;border-top:2px solid #cbd5e1;background:#e2e8f0"><td>TOTAL RÉALISÉ</td>`;
  let totRealise=0;
  dns.forEach(dn=>{
    const v=totParDN[dn];totRealise+=v;
    h+=`<td class="nr" style="color:${v<0?'#e74c3c':clr}">${Math.abs(v)>0.001?fmt(Math.round(v)):'—'}</td>`;
  });
  h+=`<td class="nr" style="color:${clr}">${fmt(Math.round(totRealise))}</td></tr>`;
  // Ligne PRÉVU
  h+=`<tr style="font-size:11px;background:#f1f5f9;color:#5a6778"><td>Prévu</td>`;
  dns.forEach(dn=>{
    h+=`<td class="nr">${fmt(prevuParDN[dn])}</td>`;
  });
  h+=`<td class="nr">${fmt(prevuTotal)}</td></tr>`;
  // Ligne AVANCEMENT %
  h+=`<tr style="font-size:11px;background:#f8fafc;font-weight:600"><td>Avancement</td>`;
  dns.forEach(dn=>{
    const pct=prevuParDN[dn]>0?(totParDN[dn]/prevuParDN[dn])*100:0;
    const pctColor=pct>100.05?'#d97706':pct>0?cP(pct):'#b8c2cc';
    h+=`<td class="nr" style="color:${pctColor}" title="${pct>100.05?'Dépassement de la référence prévue':''}">${pct>0?pct.toFixed(1)+'%'+(pct>100.05?' ⚠':''):'—'}</td>`;
  });
  const pctTot=prevuTotal>0?(totRealise/prevuTotal)*100:0;
  h+=`<td class="nr" style="color:${pctTot>100.05?'#d97706':cP(pctTot)}" title="${pctTot>100.05?'Dépassement de la référence prévue':''}">${pctTot.toFixed(1)}%${pctTot>100.05?' ⚠':''}</td></tr>`;
  h+=`</tbody></table></div>
    <div style="font-size:10px;color:#8a95a5;margin-top:8px;font-style:italic">💡 Changez le métier pour comparer le détail Soudure / Fouille / Pose / Essai.</div>
  </div>`;
  return h;
}

// Le tableau mensuel est indépendant de la courbe de trajectoire. Changer de

  <div style="overflow-x:auto"><table class="tb"><thead><tr>

      const isActive=DG_LOC_DETAIL===l.id;
      return `<th class="nr" style="font-size:9px;cursor:pointer;user-select:none;${isActive?'background:#e8f0fe;color:#2c7be5':''}" onclick="toggleDGLocality('${l.id}')" title="Cliquez pour voir le détail de ${l.nm}">${l.nm.slice(0,8)}${isActive?' ▼':''}</th>`;

      const hasValue=Math.abs(v)>0.001;
      totParLoc[l.id]+=v;totMois+=v;
      h+=`<td class="nr" style="${hasValue?'color:'+(v<0?'#e74c3c':actColors[DG_ACT_PIVOT])+';font-weight:500':'color:#b8c2cc'}">${hasValue?fmt(Math.round(v)):'—'}</td>`;
    });
    const hasMonthValue=Math.abs(totMois)>0.001;
    h+=`<td class="nr" style="font-weight:600;color:${totMois<0?'#e74c3c':actColors[DG_ACT_PIVOT]}">${hasMonthValue?fmt(Math.round(totMois)):'—'}</td></tr>`;

  h+=`<tr style="font-weight:700;border-top:2px solid #dce1e9;background:#f0f4f8"><td>TOTAL SAISI</td>`;

function refreshMonthlyPivot(scrollToDetail=false){
  const host=document.getElementById('dg-monthly-pivot');
  if(!host){draw();return;}
  let cu=cumul('9999-12-31');
  if(safeMode)cu=safeCumul(cu);
  const mKeys=Object.keys(groupByMonth()).sort();
  host.innerHTML=renderMonthlyPivot(cu,mKeys);
  if(scrollToDetail)setTimeout(()=>document.getElementById('loc-detail-anchor')?.scrollIntoView({behavior:'smooth',block:'start'}),50);
}

function setDGActivity(activity){
  if(!Object.prototype.hasOwnProperty.call(DG_ACTIVITY_LABELS,activity))return;

}

function pgDG(){
  let cu=cumul('9999-12-31');
  if(safeMode)cu=safeCumul(cu);
  const months=groupByMonth();
  const mKeys=Object.keys(months).sort();
  const tP=LOC.reduce((s,l)=>s+l.tot,0);
  const tS=LOC.reduce((s,l)=>s+cu[l.id].s,0),tF=LOC.reduce((s,l)=>s+cu[l.id].f,0),tR=LOC.reduce((s,l)=>s+cu[l.id].r,0);
  // Bardage + Essai cumulés total
  let tBar=0,tEss=0;
  LOC.forEach(l=>{l.zones.forEach(zn=>{Object.keys(zn.dn).forEach(dn=>{
    tBar+=(cu[l.id].zones[zn.zid].dn[dn]?.bar||0);
    tEss+=(cu[l.id].zones[zn.zid].dn[dn]?.ess||0);
  });});});
  // Regards : cumul réalisés + total
  let tGcFait=0,tGcTotal=0;
  LOC.forEach(l=>{if(l.regards>0){tGcTotal+=l.regards;tGcFait+=Math.min(cu[l.id].gc||0,l.regards);}});
  // Nouvelle lecture supérieure : un indice physique consolidé et des KPI décisionnels.
  const synth=dashboardPhysicalSummary(cu);
  const avPhysique=synth.index.toFixed(1);
  const nRapports=dbDates().length;
  const dernierRpt=dbDates().sort().pop();
  const restePoser=Math.max(0,tP-synth.totals.rem);
  const finance=syntheseFinanciereValidee()||financeSummaryAsSynthese(),avFinancier=finance?.taux??null,mobilisation=mobilisationAttacheeSummary();
  const activityRow=(label,pct,value,color,note='')=>`<div class="activity-row">

    ${value||note?`<div class="activity-row-foot">${value}${note?`<em>${note}</em>`:''}</div>`:''}
  </div>`;

  let h=`<div class="mn">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
      <div class="st" style="margin:0">Tableau de bord</div>

        <summary class="export-trigger">Exporter <span aria-hidden="true">⌄</span></summary>
        <div class="export-panel">
          <button class="export-item" onclick="exportDGpdf();this.closest('details').removeAttribute('open')"><b>Tableau de bord PDF</b><small>Impression et partage</small></button>
          <button class="export-item" onclick="exportComplet();this.closest('details').removeAttribute('open')"><b>Sauvegarde complète</b><small>Archive JSON des données</small></button>
        </div>
      </details>
    </div>
    <div class="dashboard-context">Projet ${escHtml(projectName())} · <b>${fmt(tP)} ml prévus</b> · ${dernierRpt?'Données au '+fD(dernierRpt):'Aucune donnée'} · ${nRapports} rapports</div>`;

  // ── 1. Synthèse décisionnelle V1.5 ──
  h+=`<div class="decision-grid">
    <div class="decision-card decision-card--index">
      <div class="decision-kicker">Avancement physique consolidé</div>
      <div class="decision-number">${avPhysique}<span>%</span></div>

  </div>`;

  // ── 1bis. Pilotage de l'achèvement du réseau ──
  const pilotage=getPilotageSettings();
  const projection=projectionCadences(synth,pilotage);

  // Le statut compare d'abord la date calculée à la cible. Sans reprise connue,
  // il se limite au constat calendaire et ne prétend pas valider une trajectoire.
  let echeanceColor='#8a95a5',echeanceValeur='Non estimé',echeanceDetail='Échéance cible non définie';
  const contractDeadline=contractPlanningDeadline();
  let echeanceBadge=contractDeadline?'Échéance du planning actif : '+fD(contractDeadline):'Échéance contractuelle non renseignée',echeanceBadgeClass='bo';
  if(pilotage.targetMode==='date'&&pilotage.targetDate){
    if(projection.date&&projection.deltaTarget!==null){
      const retard=projection.deltaTarget;
      if(retard>0){
        echeanceColor='#e74c3c';echeanceValeur='+'+retard+' j';

      echeanceDetail=joursAvant>0?'avant la cible du '+fD(pilotage.targetDate):joursAvant===0?'cible atteinte · projet non achevé':'de dépassement · cible '+fD(pilotage.targetDate);
      echeanceColor=joursAvant>0?'#f5a623':'#e74c3c';

      echeanceBadgeClass=joursAvant>0?'bo':'br';

  }

  // Le front critique est la localité qui concentre le plus grand linéaire restant.
  const fronts=LOC.map(l=>{
    let pose=0;
    l.zones.forEach(zn=>Object.keys(zn.dn).forEach(dn=>{
      const prevu=+zn.dn[dn]||0;
      const rem=+(cu[l.id]?.zones?.[zn.zid]?.dn?.[dn]?.r||0);
      pose+=Math.min(Math.max(rem,0),prevu);
    }));
    return{nom:l.nm,prevu:l.tot,pose,reste:Math.max(0,l.tot-pose)};
  }).sort((a,b)=>b.reste-a.reste);
  const frontCritique=fronts[0];
  const partFront=restePoser>0?frontCritique.reste/restePoser*100:0;

  // Production nette des deux fenêtres calendaires de 7 jours.
  let prod7=0,prod7Prec=0;
  if(dernierRpt){
    const ref=new Date(dernierRpt+'T00:00:00Z');
    const d7=new Date(ref);d7.setUTCDate(d7.getUTCDate()-7);
    const d14=new Date(ref);d14.setUTCDate(d14.getUTCDate()-14);

    const pose14=dashboardPhysicalSummary(cumul(d14.toISOString().slice(0,10))).totals.rem;
    prod7=poseRef-pose7;
    prod7Prec=pose7-pose14;
  }
  const variationProduction=prod7-prod7Prec;
  const variationProductionPct=prod7Prec!==0?variationProduction/prod7Prec*100:null;
  const productionColor=variationProduction<0?'#e74c3c':variationProduction>0?'#36b37e':'#5a6778';
  const poseObserved=cadencePoseObservee();

  const projectionColor=projection.date?(projection.deltaTarget>0?'#e74c3c':'#36b37e'):'#8a95a5';

  h+=`<div class="st">Pilotage & projection</div>`;

  h+=`<details class="projection-config no-print">

    </div>

  // ── 1ter. Carte Aléas chantier (synthèse) ──
  h+=renderAleasCard();

  // ── 2. Évolution mensuelle : production et trajectoire répondent à deux
  // questions différentes et sont donc présentées dans deux cartes autonomes.
  const quality=dataQualitySummary(cu);
  let plannedAtLatest=null;
  if(dernierRpt){
    const latestMonth=dernierRpt.slice(0,7);
    const poseStarts=PLAN_TASKS.filter(t=>t.act==='pose').map(t=>t.d0.slice(0,7)).sort();
    if(poseStarts.length){

      plannedAtLatest=buildPhysicalPlannedCurve(planMonths).at(-1)??null;

  const physicalAtLatest=synth.rates.fermeture;
  const physicalGap=plannedAtLatest===null?null:physicalAtLatest-plannedAtLatest;
  const physicalGapMl=physicalGap===null?null:physicalGap/100*tP;
  h+=`<div class="st">Évolution mensuelle</div>
  <div class="cd" id="dg-monthly-pivot">${renderMonthlyPivot(cu,mKeys)}</div>

      <div style="padding:9px 11px;background:${physicalGap!==null&&physicalGap<0?'#fef2f2':'#f0fdf4'};border-radius:7px"><div style="font-size:9px;text-transform:uppercase;color:#64748b">Écart au dernier rapport</div><b style="color:${physicalGap!==null&&physicalGap<0?'#dc2626':'#15803d'}">${physicalGap===null?'Non calculé':`${physicalGap>=0?'+':''}${physicalGap.toFixed(1)} pts · ${physicalGapMl>=0?'+':''}${fmt(physicalGapMl)} ml`}</b></div>
    </div>
    ${quality.ecartPlafonnement>0.05?`<div style="font-size:10px;color:#8a95a5;margin-top:8px;padding:8px 10px;background:#f8fafc;border-radius:7px">Lecture des données : <b>${fmt(quality.remblaiBrut)} ml</b> de pose saisis dans les rapports ; <b>${fmt(quality.remblaiPlafonne)} ml</b> retenus dans la courbe après plafonnement par zone et DN. Écart à analyser : <b style="color:#d97706">${fmt(quality.ecartPlafonnement)} ml</b>.</div>`:''}
  </div>`;

  // ── 3. Avancement par lot ──
  const lotDetailStyle=DG_SHOW_LOT_DETAILS?'':'display:none';
  const structuredConstraints=dailyConstraints();
  const migratedLegacyIds=new Set(structuredConstraints.map(c=>c.legacyId).filter(Boolean));
  const legacyConstraints=getAleas();
  h+=`<div class="st">Avancement par lot</div>
    <div class="cd" id="dg-lot-performance">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px">

        <button id="toggle-dg-lot-details" aria-pressed="${DG_SHOW_LOT_DETAILS}" class="no-print" onclick="toggleDGLotDetails()" style="font-size:10px;padding:5px 10px;border:1px solid #dce1e9;border-radius:6px;background:#f8fafc;color:#5a6778;cursor:pointer">${DG_SHOW_LOT_DETAILS?'Masquer les détails techniques':'Afficher les détails techniques'}</button>
      </div>
      <div style="overflow-x:auto"><table class="tb"><thead><tr>
        <th>Lot</th><th>Localité</th><th>Zone</th><th class="nr">Linéaire de référence</th>
        <th class="nr lot-detail" style="${lotDetailStyle}">Bardage saisi</th>
        <th class="nr lot-detail" style="${lotDetailStyle}">Soudure saisie</th>
        <th class="nr lot-detail" style="${lotDetailStyle}">Fouille saisie</th>
        <th class="nr lot-detail" style="${lotDetailStyle}">Pose saisie</th>
        <th class="nr">Conduite posée retenue</th><th class="nr">Reste à poser</th><th class="nr">Essais conformes</th><th class="nr">Regards GC</th>
        <th class="lot-detail" style="${lotDetailStyle}">Indice opérationnel interne</th><th>Situation</th>
      </tr></thead><tbody>`;
  const lotTotals={barRaw:0,soudRaw:0,fouilleRaw:0,poseRaw:0,poseRetenue:0,essaisRetenus:0,gcDone:0,gcProgress:0,gcPlanned:0};
  LOC.forEach((l,i)=>{
    const c=cu[l.id];
    const a=avancementLot(l,c);
    let lBar=0,lBarRet=0,lSoudRet=0,lFouRet=0,lPoseRet=0,lEss=0,lEssRet=0;
    l.zones.forEach(zn=>Object.keys(zn.dn).forEach(dn=>{
      const planned=+zn.dn[dn]||0;
      const dc=c.zones[zn.zid].dn[dn]||{};
      const barRaw=+dc.bar||0,soudRaw=+dc.s||0,fouRaw=+dc.f||0,poseRaw=+dc.r||0,essRaw=+dc.ess||0;
      lBar+=barRaw;lEss+=essRaw;
      lBarRet+=Math.min(Math.max(barRaw,0),planned);
      lSoudRet+=Math.min(Math.max(soudRaw,0),planned);
      lFouRet+=Math.min(Math.max(fouRaw,0),planned);

      lEssRet+=Math.min(Math.max(essRaw,0),planned);
    }));
    const restePose=Math.max(0,l.tot-lPoseRet);
    const posePct=l.tot>0?lPoseRet/l.tot*100:0;
    const essaisPct=l.tot>0?lEssRet/l.tot*100:0;
    const contraintesLot=structuredConstraints.filter(x=>(x.localite===l.id||x.localite==='tous')&&x.statut==='en_cours').length+
